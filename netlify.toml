[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# --- No Accident withdrawal (NEP-CWK-NO-ACCIDENT-WEBSITE-REMOVAL-0726) ---
# The title is withdrawn from the site by ruling. Its former post URL was
# already deleted from src/content/posts/ in commit 2e6e2f4 and has been
# serving Netlify's default 404 since. These rules replace that soft 404 with
# an explicit, permanent 410 Gone so crawlers drop the URL instead of
# re-queuing it. NOT a redirect to another product — that is prohibited.
# ROLLBACK = delete this block (and public/410.html); the URL returns to 404.
[[redirects]]
  from = "/post/no-accident-the-mackenzie-shirilla-story-the-full-account"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/post/no-accident-the-mackenzie-shirilla-story-the-full-account/"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/og/no-accident-the-mackenzie-shirilla-story-the-full-account.png"
  to = "/410.html"
  status = 410
  force = true

# --- The Trail landing page withdrawn (CONVERSION-FIRST RANK 1, 2026-07-28) ---
# /the-trail/ was the book's sales landing page (H1 + $1.99 banner + Book/Offer
# schema + "what's inside the case file"). The title is held for worthiness
# review, so the page was removed rather than left as a stale promotion.
# 301 — NOT 410 — because the title is expected to come back after review, and
# because the free, sourced account of the same case is still published. The
# target is the topic-matched post, not /books/: sending Rachel Morin queries to
# a store page whose only title is a jury-procedure book would read as a soft
# 404 to crawlers and as a bait-and-switch to readers. Inbound links from six
# posts, the old nav item and the sitemap all land correctly here.
# ⚠ SEO-material decision — Cassian's call before merge. Alternatives: 301 to
# /books/, or 410 Gone. ROLLBACK = delete this block and restore
# src/pages/the-trail.astro from git history.
[[redirects]]
  from = "/the-trail"
  to = "/post/the-trail-the-murder-of-rachel-morin-the-full-account/"
  status = 301

[[redirects]]
  from = "/the-trail/"
  to = "/post/the-trail-the-murder-of-rachel-morin-the-full-account/"
  status = 301

[[redirects]]
  from = "/the-trail/*"
  to = "/post/the-trail-the-murder-of-rachel-morin-the-full-account/"
  status = 301

[[redirects]]
  from = "/free-dossier"
  to = "/#free-guide"
  status = 301

[[redirects]]
  from = "/free-dossier/*"
  to = "/#free-guide"
  status = 301

[[redirects]]
  from = "/rachel-morin"
  to = "/#free-guide"
  status = 301

[[redirects]]
  from = "/rachel-morin/*"
  to = "/#free-guide"
  status = 301

# --- Clancy cluster: retire legacy trial slug to the tracker (0715BR) ---
[[redirects]]
  from = "/lindsay-clancy-trial-2026-postpartum-psychosis"
  to = "/post/lindsay-clancy-trial/"
  status = 301

[[redirects]]
  from = "/lindsay-clancy-trial-2026-postpartum-psychosis/"
  to = "/post/lindsay-clancy-trial/"
  status = 301

# --- Gilson CTA target (2026-08-01) ---
# The published podcast and video both close by telling listeners to go to
# "cassiancreed.com/gilson". That path never existed and was serving a 404 to
# the highest-intent traffic in the funnel. The CTA is baked into rendered audio
# and video and cannot be edited, so the path has to exist.
# ROLLBACK = delete this block; /gilson returns to 404.
[[redirects]]
  from = "/gilson"
  to = "/post/sara-gilson-jeremiah-duffey-owasso-case-file/"
  status = 301

[[redirects]]
  from = "/gilson/"
  to = "/post/sara-gilson-jeremiah-duffey-owasso-case-file/"
  status = 301

[[redirects]]
  from = "/gilson/*"
  to = "/post/sara-gilson-jeremiah-duffey-owasso-case-file/"
  status = 301

# --- 404 repair (0715BR) ---
[[redirects]]
  from = "/products"
  to = "/books/"
  status = 301

[[redirects]]
  from = "/products/*"
  to = "/books/"
  status = 301

# CY2 (NEP-DPL-CMT-0718CY): retired Subscribe-era routes now match the live
# nav "Free Guide" target. There is no /free-guide/ page; the nav item points
# to /#free-guide (Base.astro navItems), so /signup and /subscribe follow it.
[[redirects]]
  from = "/signup"
  to = "/#free-guide"
  status = 301

[[redirects]]
  from = "/subscribe"
  to = "/#free-guide"
  status = 301

# --- AK8: legacy static pages ported to Astro posts (NEP-DPL-CWK-0718AK) ---
# force = true is REQUIRED: the old files still exist under public/, and Netlify
# serves a matching static file BEFORE consulting a non-forced redirect.
[[redirects]]
  from = "/blog/chevy-chase-cold-case-dna"
  to = "/post/chevy-chase-cold-case-dna/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/eugene-gligor-leslie-preer"
  to = "/post/eugene-gligor-leslie-preer/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/othram-genetic-genealogy-leslie-preer-cold-case"
  to = "/post/othram-genetic-genealogy-leslie-preer-cold-case/"
  status = 301
  force = true

[[redirects]]
  from = "/leslie-preer-murder"
  to = "/post/leslie-preer-murder/"
  status = 301
  force = true
