[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/free-dossier"
  to = "/#subscribe"
  status = 301

[[redirects]]
  from = "/free-dossier/*"
  to = "/#subscribe"
  status = 301

[[redirects]]
  from = "/rachel-morin"
  to = "/#subscribe"
  status = 301

[[redirects]]
  from = "/rachel-morin/*"
  to = "/#subscribe"
  status = 301
