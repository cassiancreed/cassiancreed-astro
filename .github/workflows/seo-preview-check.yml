name: SEO preview compatibility
on:
  push:
    branches: [seo/2026-10-18-search-and-ai-fixes]
permissions:
  contents: read
concurrency:
  group: seo-audit-verification
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Browser setup
        run: npx playwright install --with-deps chromium
      - name: Check Astro preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/seo-preview.log 2>&1 &
          node --input-type=module -e "for(let i=0;i<60;i++){try{const r=await fetch('http://127.0.0.1:4321/');if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,500));}process.exit(1);"
          node scripts/check-seo-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-preview-checks
          path: |
            /tmp/seo-*.json
            /tmp/seo-*.png
            /tmp/seo-preview.log
