ckell-how-dna-caught-robert-napper-and-cleared-colin-stagg/\",\n  \"/post/the-taylor-parker-case-the-murder-of-reagan-simmons-hancock-and-where-it-stands-now/\",\n  \"/post/this-week-in-court-october-4-2026/\",\n  \"/post/this-week-in-court-october-19-23-2026/\",\n  \"/post/this-week-in-court-august-30-2026/\",\n  \"/post/warning-signs-the-science-validates-a-safety-system/\",\n  \"/post/two-names-that-come-first-dominic-russo-and-davion-flanagan/\",\n  \"/post/what-happens-at-d4vds-monday-hearing/\",\n  \"/post/what-a-racial-justice-act-violation-means-dominguez/\",\n  \"/post/what-actually-happens-on-day-one-of-a-high-profile-trial/\",\n  \"/post/what-happened-in-the-idaho-student-murders-the-bryan-kohberger-case-explained/\",\n  \"/post/what-actually-happens-when-a-jury-deliberates/\",\n  \"/post/why-was-keffe-d-convicted-tupac-shakur/\",\n  \"/post/why-do-innocent-people-confess-to-crimes-they-didn-t-commit/\",\n  \"/post/what-is-coercive-control-the-signs-examples-and-what-to-do/\",\n  \"/post/why-do-some-murders-go-unsolved-linkage-blindness/\",\n  \"/post/whose-consent-travels-across-borders/\"\n]);\n// Reviewed event matches, not case names or stale IDs. No book is inferred\n// from a hearing's notes, a grand jury, or an appellate reference to a verdict.\nexport const JURY_CHESS_ENTRY_IDS = new Set([\"faith-hedgepeth-trial\",\"murdaugh-retrial\",\"salazar-clinkunbroomer-trial\",\"bhatt-jury-selection\",\"moore-sherman-trial\",\"killins-verdict-sentencing\",\"banks-federal-trial\",\"bohm-trial\",\"eaton-burlington-trial\",\"mary-collins-trial\",\"martin-risner-sentencing\",\"conway-mo3-trial\"]);\nexport const JURY_CHESS_EXCLUDED_IDS = new Set([\"goncalves-wsu-trial\",\"aramburu-paris-trial\",\"kepner-federal-trial\",\"brianna-moore-trial\",\"clancy-trial\",\"virzi-trial\",\"michael-vaughan-trial\",\"crum-odom-verdict\",\"preston-lord-meisner-trial\",\"preston-lord-five-defendant-trial\",\"elmore-laura-miller-trial\",\"wagner-trial\",\"gardner-jury-selection\",\"gardner-trial\",\"bridegan-fernandez-trial\",\"farwell-jury-trial\",\"farwell-trial-oct19\",\"carter-brooks-trial\",\"ryan-cavett-trial\"]);\n// Jury Chess only on US criminal jury events. Never civil, foreign, child-victim or juvenile cases. Owner may override per case.\nexport function juryChessEligible(entry) {\n  if (JURY_CHESS_EXCLUDED_IDS.has(entry.id)) return false;\n  return JURY_CHESS_ENTRY_IDS.has(entry.id);\n}\nexport const JURY_CHESS_LINK = {\n  url: 'https://cassiancreed.com/books/',\n  text: 'Get Jury Chess',\n  bookKey: 'jury-chess',\n  placement: 'court_calendar_jury_chess',\n  type: 'book',\n  badge: 'BOOK',\n  paid: false,\n};\nexport const CALENDAR_LINK_TYPES = ['free', 'paid', 'book'];\nexport function classifyCalendarLink(link) {\n  const path = pathKey(link.url);\n  const product = Object.values(LIVE_PRODUCTS).find((item) => pathKey(item.url) === path);\n  const isBook = path === '/books' || link.bookKey === 'jury-chess' || /\\/products\\/(jury-chess|two-stories-one-verdict)$/.test(path);\n  const isProduct = /^https:\\/\\/cassiancreed\\.beehiiv\\.com\\/products\\//.test(link.url);\n  // A destination that sells a product must never inherit a FREE override.\n  const type = isBook ? 'book' : isProduct ? 'paid' : (link.type || 'free');\n  const price = product?.price || link.price;\n  return { ...link, type, price, paid: type === 'paid', badge: type === 'free' ? 'FREE' : type === 'book' ? 'BOOK' : price ? price + ' GUIDE' : 'GUIDE' };\n}\nexport function calendarLinkTypesFor(entries) {\n  return CALENDAR_LINK_TYPES.filter((type) => entries.some((entry) => (entry.explainerLinks || calendarLinksFor(entry)).some((link) => link.type === type)));\n}\nconst byEntry = new Map(CALENDAR_EXPLAINER_CASES.flatMap((item) => item.entryIds.map((id) => [id, item])));\nconst pathKey = (url) => url.replace(/^https:\\/\\/cassiancreed\\.com/, '').split('?')[0].replace(/\\/$/, '');\nconst eligibleFree = (url) => !url.startsWith('/post/') || PUBLISHED_POSTS.has(url.split('?')[0]);\n\nexport function calendarLinksFor(entry) {\n  const matched = byEntry.get(entry.id);\n  const free = [];\n  const paid = [];\n  const seen = new Set();\n  const addFree = (url, text) => {\n    if (!url || !eligibleFree(url) || seen.has(pathKey(url))) return;\n    seen.add(pathKey(url));\n    free.push({ url, text, paid: false });\n  };\n  addFree(entry.link, entry.linkText || 'Read the case');\n  addFree(entry.link2, entry.linkText2 || 'Read the case');\n  for (const link of matched?.free || []) addFree(link.url, link.text);\n  for (const link of HISTORICAL_ROUNDUPS) {\n    if (link.keys.includes(matched?.key) || link.ids.includes(entry.id)) addFree(link.url, link.text);\n  }\n  const date = entry.dateISO || '';\n  if (WEEKLY_ROUNDUP_IDS.has(entry.id) && date >= '2026-10-19' && date <= '2026-10-23') {\n    addFree(WEEKLY_ROUNDUP.url, WEEKLY_ROUNDUP.text);\n  }\n  const addPaid = (guide) => {\n    if (!guide || seen.has(pathKey(guide.url))) return;\n    const product = Object.values(LIVE_PRODUCTS).find((item) => pathKey(item.url) === pathKey(guide.url));\n    if (!product) return;\n    seen.add(pathKey(guide.url));\n    paid.push({ ...guide, paid: true });\n  };\n  for (const guide of [EXISTING_CASE_GUIDES[entry.id]].flat().filter(Boolean)) addPaid(guide);\n  for (const key of matched?.paid || []) {\n    const product = LIVE_PRODUCTS[key];\n    if (!product) continue;\n    addPaid({\n      url: product.url + '?utm_source=cassiancreed.com&utm_medium=court_calendar&utm_campaign=' + (PRODUCT_CAMPAIGNS[key] || ('explainer_' + matched.key + '_v1')) + '&utm_content=' + entry.id.replace(/-/g, '_') + '_entry',\n      text: product.title + ' — ' + product.price,\n      bookKey: key,\n      placement: 'court_calendar_' + entry.id.replace(/-/g, '_') + '_entry',\n    });\n  }\n  const links = [...free, ...paid].map(classifyCalendarLink);\n  if (juryChessEligible(entry) && !links.some((link) => link.type === 'book')) links.push({ ...JURY_CHESS_LINK });\n  // The existing Jury Chess promo retains its approved wording; its BOOK link\n  // now goes to the same Books page as the other trial entries.\n  return links.filter((link) => link.type !== 'book' || juryChessEligible(entry))\n    .map((link) => link.bookKey === 'jury-chess' ? { ...link, ...JURY_CHESS_LINK, text: link.text } : link)\n    .sort((a, b) => CALENDAR_LINK_TYPES.indexOf(a.type) - CALENDAR_LINK_TYPES.indexOf(b.type));\n}\n","src/content/posts/what-happens-at-d4vds-monday-hearing.md":"---\ntitle: \"What Happens at D4vd's Monday Hearing\"\nseoTitle: \"D4vd Court Hearing Oct. 19: What Happens Monday\"\ndescription: \"D4vd is due in an LA court Monday, Oct. 19, for a status conference. Here is what that means, where the case stands, and what could happen next.\"\npubDate: 2026-10-17\ntag: \"Explainers\"\nfeatured: false\ncapture: \"jury\"\nvictim: \"Celeste Rivas Hernandez\"\nlocation: \"Los Angeles, California\"\njurisdiction: \"Los Angeles County Superior Court\"\nstatus: \"Charged; pleaded not guilty; presumed innocent\"\n---\n\n*Updated Saturday, October 17, 2026. This story involves the death of a child.*\n\nThe singer D4vd goes back to court on Monday, October 19, 2026. It is a short check-in hearing in downtown Los Angeles. It is not a trial. No verdict will come Monday.\n\nHis legal name is David Anthony Burke. He is charged in the death of Celeste Rivas Hernandez. She was 14 years old. He has pleaded not guilty. He is presumed innocent unless a jury finds him guilty.\n\n## What's happening Monday\n\nNews reports call Monday's hearing a status conference. ABC News described it as a check on whether both sides are ready for trial.\n\nThe time has not been publicly verified. Court times can change. Check our Court Calendar before Monday.\n\n## Who Celeste was\n\nCeleste Rivas Hernandez was a 14-year-old girl. September 7, 2026, would have been her 16th birthday. Her family marked that day in public and asked officials to seek the death penalty.\n\nShe was a daughter. She was a kid. This case is about her first.\n\n## Where the case stands\n\nHere are the facts from public reports:\n\n- **Arrest.** Police arrested Burke on April 16, 2026.\n- **Charges.** Prosecutors charged him on April 20, 2026. He faces three counts: first-degree murder, continuous sexual abuse of a child under 14, and unlawful mutilation of human remains.\n- **Special allegations.** The complaint says the killing was done because Celeste was a witness, for money, and while \"lying in wait.\" These are prosecutors' claims. They are not proven.\n- **Plea.** He pleaded not guilty.\n- **Trial ordered.** On July 27, 2026, Judge Charlaine Olmedo ruled there was enough evidence to go to trial. That was after a five-day preliminary hearing. That ruling is not a finding of guilt.\n- **New lawyers.** On August 31, 2026, his private lawyers left the case. The public defender's office took over. He pleaded not guilty again that day.\n- **Custody.** He is held in jail without bail.\n- **Death penalty.** The district attorney has not decided whether to seek it. The other option, if he is convicted, is life in prison without parole.\n\nAs of October 17, 2026, we found no public report of a trial date or a death penalty decision.\n\nProsecutors have a theory about why this happened. A theory is not proof. A jury will decide.\n\n## What a status conference is\n\nA status conference is a short meeting in court. The judge asks both sides, \"Where are we?\"\n\n**What could happen Monday:**\n\n- The judge could set a trial date, or set another hearing.\n- The lawyers could ask for more time. New defense lawyers often need time to learn a big case.\n- Both sides could talk about evidence they still need to share.\n- Prosecutors could say whether they will seek the death penalty. That is possible, but no one has said it will happen Monday.\n\n**What will not happen Monday:**\n\n- No trial. No jury. No verdict.\n- Status conferences usually do not include witness testimony.\n\n## What to watch for next\n\n- **A trial date.** None has been set in public reports.\n- **The death penalty choice.** The district attorney is still weighing it.\n- **Delays.** A new defense team may ask for more time.\n- **The civil case.** Celeste's parents filed a separate wrongful death lawsuit in September 2026. That is a different case from the criminal one.\n\nWe will update our Court Calendar after Monday.\n\n## Want the full case in one place?\n\n<div class=\"guide-offer\">\n<a class=\"calendar-resource\" data-link-type=\"paid\" href=\"https://cassiancreed.beehiiv.com/products/celeste-rivas-hernandez-d4vd-charges-guide?utm_source=cassiancreed.com&amp;utm_medium=post_cta&amp;utm_campaign=explainer_d4vd_v2&amp;utm_content=d4vd_free_post_end\" target=\"_blank\" rel=\"noopener noreferrer\" data-book-key=\"celeste-rivas-hernandez-d4vd-charges-guide\" data-cta-placement=\"d4vd_free_post_end\"><span class=\"calendar-badge\" data-link-type=\"paid\">$1.99 GUIDE</span><span>The Celeste Rivas Hernandez Case: A Plain-English Guide to the D4vd Charges →</span></a>\n</div>\n\n## Sources\n\n- Boston Globe, \"Singer D4vd arrested in death of Celeste Rivas,\" April 16, 2026: https://www.bostonglobe.com/2026/04/16/arts/david-burke-arrested-los-angeles/\n- Courthouse News Service, \"Singer D4vd charged in murder of 14-year-old girl,\" April 20, 2026: https://www.courthousenews.com/singer-d4vd-charged-in-murder-of-14-year-old-girl/\n- AP via ABC7 News, \"Judge rules singer D4vd must stand trial in killing of 14-year-old Celeste Rivas Hernandez,\" July 27, 2026: https://abc7news.com/story/judge-rules-singer-d4vd-stand-trial-killing-14-year-old-celeste-rivas-hernandez/19586719/\n- ABC News, \"D4vd's attorneys withdraw from murder case, public defender appointed,\" August 31, 2026: https://abcnews.com/US/d4vd-set-return-court-after-judge-orders-stand/story?id=136043689\n- ABC7, \"D4vd case: Singer's lawyers withdraw, public defenders step in,\" August 31, 2026: https://abc7ny.com/story/d4vd-case-singer-set-return-court-ordered-stand-trial-killing-14-year-old-celeste-rivas-hernandez/19769402/\n- City News Service via KESQ, \"Victim's family urges officials to seek death penalty vs. singer D4vd,\" September 7, 2026: https://kesq.com/news/california/2026/09/07/victims-family-urges-officials-to-seek-death-penalty-vs-singer-d4vd/\n- Complex, \"D4vd Hit With Wrongful Death Lawsuit From Celeste Rivas Hernandez's Family,\" September 9, 2026: https://www.complex.com/music/a/tracewilliamcowen/d4vd-wrongful-death-lawsuit\n\n**Follow every hearing on our Court Calendar:** https://cassiancreed.com/court-calendar/\n","src/content/posts/michelle-parker-case-dale-smith-charged-no-body.md":"---\ntitle: \"The Michelle Parker Case: How Can There Be a Murder Charge When She Has Never Been Found?\"\nseoTitle: \"Michelle Parker Case: Why Dale Smith Jr. Faces a Murder Charge Without a Body\"\ndescription: \"Michelle Parker vanished in Orlando in 2011. In October 2026, her ex-fiancé Dale Smith Jr. was charged with second-degree murder. Here is what Florida law allows, what police say changed, and what happens next.\"\npubDate: 2026-10-15\ntag: \"Case Files\"\nfeatured: false\nvictim: \"Michelle Parker\"\nincidentDate: \"November 17, 2011 (last seen)\"\nlocation: \"Orlando, Florida\"\njurisdiction: \"Orange County, Florida (Ninth Judicial Circuit)\"\nstatus: \"Dale Smith Jr. charged with second-degree murder; pleaded not guilty; held without bond; presumed innocent\"\n---\n\n**Status as of October 15, 2026, 3:47 p.m. Eastern:** Dale Smith Jr. is charged with second-degree murder in the 2011 disappearance of Michelle Parker. He pleaded not guilty on October 15 and is being held without bond. He is presumed innocent. Michelle has never been found. [See the live case status on our Court Calendar.](/court-calendar/#parker-smith-first-appearance)\n\n> **Quick answer:** Yes, Florida can charge murder without a body. The Florida Supreme Court has said a death caused by a crime can be proven with circumstantial evidence, \"even without any evidence of the discovery of the victim's body.\" Florida also has no time limit for prosecuting a felony that caused a death. A jury still has to be convinced beyond a reasonable doubt.\n\n## Who Michelle Parker Is\n\nMichelle Parker was a 33-year-old mother from Orlando. On November 17, 2011, she was last seen after going to the home of her ex-fiancé, Dale Smith Jr.\n\nThat same day, a TV court show aired an episode with the couple. On *The People's Court*, taped months earlier, Smith had sued Parker over a $5,000 engagement ring. The judge ruled they were both responsible and ordered Parker to pay him $2,500, according to the Associated Press.\n\nHer family reported her missing that day. For 15 years, they have asked for answers.\n\n## The 15-Year Timeline\n\n- **Nov. 17, 2011:** Michelle is last seen after going to Smith's home in Orlando's Lee Vista area. Her family reports her missing.\n- **Nov. 18, 2011:** Police find her SUV abandoned in an Orlando parking lot.\n- **Dec. 7, 2011:** Her cellphone is recovered from a lake south of Orlando.\n- **Late 2011:** Within two weeks, police call Smith their primary suspect. He is not charged. He has long denied any wrongdoing.\n- **Sept. 2022:** An anonymous donor raises the reward for information to up to $200,000.\n- **Oct. 2025 to Oct. 2026:** Investigators re-examine old statements and evidence, using newer digital tools.\n- **Oct. 14, 2026:** Orlando police arrest Smith at his workplace on one count of second-degree murder.\n- **Oct. 15, 2026:** Smith pleads not guilty and is held without bond.\n\n## What Police Say Changed\n\nOrlando Police Chief Eric Smith called Dale Smith Jr. \"the last known person to see or hear from Michelle.\"\n\nPolice have shared only a few details. They say they:\n\n- re-examined witness statements and conflicting statements Smith gave over the years;\n- used newer digital forensics on phones, computers and vehicles; and\n- gathered new evidence in the past year.\n\nThe 46-page arrest affidavit is **sealed**, according to Smith's lawyer. That means the public cannot yet see the full evidence. Any claim about what it says should be treated with care until it is released.\n\n## What the Defense Says\n\nSmith's attorney, Rajan Joshi, told WFTV that he read the sealed affidavit but could not keep a copy. He said it mentions recovered text messages between Parker and Smith and a recent interview with one of Smith's friends. He called the case largely circumstantial and said he saw no \"smoking gun.\" He said Smith maintains his innocence.\n\nThese are the defense's descriptions. The court has not ruled on the evidence.\n\n## What Florida Law Allows\n\n**No time limit.** Under Florida law, a prosecution \"for a felony that resulted in a death may be commenced at any time\" (Florida Statutes, section 775.15). So 15 years does not stop a murder charge.\n\n**No body required.** In *Crain v. State* (2004), the Florida Supreme Court said the basic proof of a murder — that someone died because of another person's crime — \"can be proven circumstantially, even without any evidence of the discovery of the victim's body.\" That court relied on earlier Florida rulings that say the same thing.\n\n**What the charge means.** Second-degree murder in Florida is a death caused by an act \"imminently dangerous to another and evincing a depraved mind\" (section 782.04). It does not require proof of a plan to cause death. It is a first-degree felony, punishable by up to life in prison. State Attorney Monique Worrell said cases like this usually start at second-degree murder, and the charge could be raised if evidence supports it.\n\n**The bar is still high.** A charge is not proof. To convict, prosecutors must convince a jury beyond a reasonable doubt. Cases with no body often rely on many small facts that must fit together.\n\n## What Happens Next\n\n1. **Bond hearing.** Smith is held without bond. His lawyer plans to ask for an \"Arthur hearing,\" named for the 1980 Florida case *State v. Arthur*. At that hearing, prosecutors must show the \"proof is evident or the presumption is great\" to keep him jailed before trial. No date has been set.\n2. **Evidence sharing.** The defense says it has not yet received the state's evidence. That exchange, called discovery, comes next.\n3. **The affidavit.** The defense says prosecutors indicated it could be unsealed soon. When it is released, the new facts will appear on our Court Calendar with an as-of date.\n\nWe track every new court date on our [Court Calendar](/court-calendar/#parker-smith-bond-hearing).\n\n## The Search for Michelle\n\nPolice say Michelle's remains have not been found, and the search continues. Anyone with information can contact the Orlando Police Department.\n\n**Get free alerts when this case moves:** [Subscribe to Cassian Creed case alerts](https://cassiancreed.beehiiv.com/subscribe).\n\n## Want the Full Case in One Place?\n\nOur **Both Sides of the Story: Michelle Parker — Can There Be a Murder Case With No Body?** guide is $1.99. Dale Smith Jr. is charged and presumed innocent.\n\n<div class=\"guide-offer\">\n<a class=\"calendar-resource\" data-link-type=\"paid\" href=\"https://cassiancreed.beehiiv.com/products/both-sides-michelle-parker-guide-v3?utm_source=cassiancreed.com&amp;utm_medium=post_cta&amp;utm_campaign=explainer_parker_bothsides_v3&amp;utm_content=parker_free_post_end\" target=\"_blank\" rel=\"noopener noreferrer\" data-book-key=\"both-sides-michelle-parker-guide-v3\" data-cta-placement=\"parker_free_post_end\"><span class=\"calendar-badge\" data-link-type=\"paid\">$1.99 GUIDE</span><span>Both Sides of the Story: Michelle Parker — Can There Be a Murder Case With No Body? →</span></a>\n</div>\n\n## Sources\n\n- Orlando Police news conference coverage: [ClickOrlando / WKMG (Oct. 14, 2026)](https://www.clickorlando.com/news/local/2026/10/14/orlando-police-to-provide-update-on-michelle-parker-missing-woman-case/), [Spectrum News 13 (Oct. 14, 2026)](https://mynews13.com/fl/orlando/news/2026/10/14/orlando-police-arrest-ex-fiance-of-michelle-parker-in-case-of-the-missing-mother), [CBS News (Oct. 14, 2026)](https://www.cbsnews.com/news/michelle-parker-fiancee-orlando-florida-arrest-murder-charge-2011-disappearance-peoples-court/)\n- Plea, bond status and defense statements: [WFTV (Oct. 15, 2026)](https://www.wftv.com/news/local/dale-smith-jr-pleads-not-guilty-michelle-parker-murder-case-remains-jailed-without-bond/B7A3CWHE4ZA5RDAC7RJZ2LWM5Q/)\n- Associated Press report (People's Court ruling; remains not found): [AP (Oct. 15, 2026)](https://apnews.com/article/missing-woman-florida-peoples-court-c874ffee573d6fd86c43da95a742a717)\n- Timeline: [FOX 35 Orlando (Oct. 14, 2026)](https://www.fox35orlando.com/news/michelle-parker-timeline-events-surrounding-orlando-moms-disappearance-from-2011-2026)\n- Orange County Corrections, first-appearance list (Oct. 15, 2026): [netapps.ocfl.net](https://netapps.ocfl.net/BestJail/Home/FirstAppearance)\n- Florida Statutes [section 775.15](https://www.flsenate.gov/Laws/Statutes/2025/775.15) and [section 782.04](https://www.flsenate.gov/Laws/Statutes/2025/782.04)\n- *Crain v. State*, 894 So. 2d 59 (Fla. 2004): [CourtListener](https://www.courtlistener.com/opinion/1940000/crain-v-state/)\n- *State v. Arthur*, 390 So. 2d 717 (Fla. 1980): [CourtListener](https://www.courtlistener.com/opinion/1902072/state-v-arthur/)\n","scripts/test-guide-offers.mjs":"import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport {readFileSync,readdirSync} from 'node:fs';\nimport {join} from 'node:path';\nimport {calendarLinksFor,classifyCalendarLink} from '../src/data/calendar-explainer-links.mjs';\nimport {parseCourtCalendar} from '../src/data/court-calendar-parser.mjs';\nconst c=parseCourtCalendar(readFileSync('src/data/court-calendar.tsv','utf8'));\nconst entries=[...c.entries,...c.appeals,...c.unconfirmed,...c.investigations,...c.completed];\nconst oldKeys=['michelle-parker-'+'case-guide','both-sides-michelle-parker-'+'no-body-guide'];\nconst productPrefix='https://cassiancreed.beehiiv.com/products/';\nconst keys=['both-sides-michelle-parker-guide-v3','celeste-rivas-hernandez-d4vd-charges-guide'];\nconst files=(dir)=>readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?files(join(dir,e.name)):[join(dir,e.name)]);\ntest('no retired Parker product destination remains in site sources or built output',()=>{\n for(const root of ['src','public','dist'])for(const file of files(root)){\n  if(!/\\.(?:astro|mjs|ts|md|mdx|json|txt|tsv|html|xml|js)$/.test(file))continue;\n  const content=readFileSync(file,'utf8');\n  for(const key of oldKeys)assert.ok(!content.includes(productPrefix+key),file);\n }\n});\ntest('each Parker calendar entry has only the v3 paid offer after free explainers',()=>{\n for(const id of ['parker-smith-first-appearance','parker-smith-bond-hearing']){\n  const entry=entries.find(e=>e.id===id);assert.ok(entry);\n  const links=calendarLinksFor(entry),paid=links.filter(l=>l.type==='paid');\n  assert.equal(paid.length,1);\n  assert.equal(new URL(paid[0].url).pathname,'/products/both-sides-michelle-parker-guide-v3');\n  assert.equal(paid[0].text,'Both Sides of the Story: Michelle Parker — Can There Be a Murder Case With No Body?');\n  assert.equal(paid[0].badge,'$1.99 GUIDE');\n  assert.ok(links.slice(0,links.indexOf(paid[0])).every(l=>l.type==='free'));\n }\n});\ntest('a Beehiiv product or book destination cannot be labeled FREE',()=>{\n for(const url of [...keys.map(key=>productPrefix+key),productPrefix+'jury-chess','/books/']){\n  assert.notEqual(classifyCalendarLink({url,type:'free'}).badge,'FREE');\n }\n});\ntest('rendered guide offers show prices and no preview links are published',()=>{\n let count=0;\n for(const file of files('dist').filter(f=>f.endsWith('.html'))){\n  const html=readFileSync(file,'utf8');\n  assert.ok(!html.includes('Read page 1 free'),file);\n  assert.ok(!html.includes('/previews/'),file);\n  for(const match of html.matchAll(/<a\\b([^>]*)>([\\s\\S]*?)<\\/a>/g)){\n   const href=match[1].match(/\\bhref=\"([^\"]*)\"/)?.[1];\n   if(match[1].includes('data-link-type=\"free\"'))assert.ok(!href?.startsWith(productPrefix),'FREE product '+file);\n   if(!keys.some(key=>href?.split('?')[0]===productPrefix+key))continue;\n   assert.match(match[2],/\\$1\\.99 GUIDE/,file);count++;\n  }\n }\n assert.ok(count>=8,'Expected calendar and both free-post offers');\n});\ntest('D4vd keeps its paid section before Sources and posts reuse shared badge CSS',()=>{\n const s=readFileSync('src/content/posts/what-happens-at-d4vds-monday-hearing.md','utf8');\n assert.ok(s.indexOf('## What to watch for next')<s.indexOf('## Want the full case in one place?'));\n assert.ok(s.indexOf('## Want the full case in one place?')<s.indexOf('## Sources'));\n assert.ok(s.includes(productPrefix+keys[1]));\n assert.match(readFileSync('src/pages/post/[slug].astro','utf8'),/calendar-explainer-links\\.css/);\n assert.match(readFileSync('src/components/CalendarExplainerLink.astro','utf8'),/calendar-explainer-links\\.css/);\n for(const file of files('src')){\n  if(!/\\.(?:astro|mjs|md|mdx|ts|css)$/.test(file))continue;\n  const content=readFileSync(file,'utf8');\n  assert.ok(!content.includes('Read page 1 free'),file);assert.ok(!content.includes('/previews/'),file);\n }\n});\n"};
