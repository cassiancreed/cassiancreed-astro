name: GUIDE-01 paid-only owner split and verification
on:
  push:
    branches: [guides/2026-10-18-parker-v3-previews]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply owner split and remove preview integration
        run: |
          node --input-type=module <<'NODE'
          import{writeFileSync,mkdirSync,rmSync}from'node:fs';
          import{dirname}from'node:path';
          const changes={"src/components/HomeCourtCalendar.astro":"---\nimport calendarTsv from '../data/court-calendar.tsv?raw';\nimport CalendarExplainerLink from './CalendarExplainerLink.astro';\nimport { calendarLinksFor, calendarLinkTypesFor, JURY_CHESS_LINK } from '../data/calendar-explainer-links.mjs';\nimport { formatCalendarDate, parseCourtCalendar } from '../data/court-calendar-parser.mjs';\nimport internationalTsv from '../data/international-watch.tsv?raw';\nimport { parseInternationalWatch } from '../data/international-watch-parser.mjs';\nimport { calendarDisplayPriority, rankCalendarEntries } from '../data/calendar-display-priority.mjs';\n\ninterface Props {\n  fullPage?: boolean;\n}\n\nconst { fullPage = false } = Astro.props;\nconst CalendarHeading = fullPage ? 'h1' : 'h2';\n\nconst CALENDAR_ALERT_FORM_ID = '4d7c7c61-f04c-4870-bf20-f1af8a540e0f';\nconst CALENDAR_ALERT_URL = `https://subscribe-forms.beehiiv.com/v3/forms/${CALENDAR_ALERT_FORM_ID}?utm_source=website&utm_medium=calendar_alert&utm_campaign=court_calendar_updates`;\n// Add a case only after its paid explainer has a verified public checkout URL.\nconst LIVE_EXPLAINER_IDS = new Set(['patterson-appeal']);\n// Lindsay Clancy sales promotion is paused until the post-mistrial PDF and\n// checkout copy are current. Keep the verified tracker live without a paid CTA.\nconst CASE_BOOKS = new Map([]);\nconst calendar = parseCourtCalendar(calendarTsv);\nconst international = parseInternationalWatch(internationalTsv);\nconst lastUpdated = formatCalendarDate(calendar.metadata.last_updated);\nconst localDateParts = Object.fromEntries(\n  new Intl.DateTimeFormat('en-US', {\n    timeZone: 'America/Los_Angeles',\n    year: 'numeric',\n    month: '2-digit',\n    day: '2-digit',\n  })\n    .formatToParts(new Date())\n    .filter((part) => part.type !== 'literal')\n    .map((part) => [part.type, part.value]),\n);\nconst buildDate = `${localDateParts.year}-${localDateParts.month}-${localDateParts.day}`;\nconst worldwideListed = international.listed.map((entry) => ({\n  ...entry,\n  proceeding: entry.matter,\n  ongoing: false,\n  groups: ['next'],\n  link: null,\n  linkText: null,\n}));\nconst visibleEntries = rankCalendarEntries([\n  ...calendar.entries.filter((entry) => entry.ongoing || entry.dateISO >= buildDate),\n  ...worldwideListed.filter((entry) => entry.dateISO >= buildDate),\n]);\nconst ongoingEntries = [...visibleEntries]\n  .filter((entry) => entry.ongoing)\n  .sort((a, b) => calendarDisplayPriority(b) - calendarDisplayPriority(a));\nconst preferredCalendarLabels = new Map([\n  ['banks-federal-trial', 'Lil Durk federal trial'],\n  ['bridegan-fernandez-trial', 'Jared Bridegan case'],\n  ['davis-tupac-openings', 'Tupac sentencing report'],\n  ['flynn-final-pretrial', 'Ashley Flynn case'],\n  ['flynn-trial', 'Ashley Flynn case'],\n  ['gardner-jury-selection', 'Jared Bridegan case'],\n  ['gardner-trial', 'Jared Bridegan case'],\n  ['lund-calcagni-trial', 'Mark Calcagni case'],\n  ['peters-berger-resolution', 'Lily Peters case'],\n  ['salazar-clinkunbroomer-trial', 'Deputy Ryan Clinkunbroomer case'],\n]);\nconst conciseStatus = (status = '') => status\n  .split(/(?<=[.!?])\\s+/)\n  .slice(0, 2)\n  .join(' ');\nconst futureDatedCaseNames = new Set(\n  visibleEntries\n    .filter((entry) => !entry.ongoing && entry.dateISO >= buildDate)\n    .map((entry) => entry.case),\n);\n// A rolling calendar hides past dates. Keep active trials visible in a slim,\n// undated rail instead of moving them onto a day the source did not verify.\nconst ongoingNowEntries = ongoingEntries\n  .filter((entry) => entry.dateISO < buildDate && !futureDatedCaseNames.has(entry.case))\n  .slice(0, 3);\nconst selectedEntry = visibleEntries.find((entry) => !entry.ongoing && entry.dateISO >= buildDate) ?? ongoingEntries[0] ?? null;\nconst clientEntries = visibleEntries.map((entry) => ({\n  id: entry.id,\n  caseName: entry.case,\n  calendarLabel: preferredCalendarLabels.get(entry.id) || entry.case.split(' — ')[0],\n  proceeding: entry.proceeding,\n  // Grid placement always uses the proceeding's verified date. Trend strength\n  // controls prominence within a real date; it never supplies or moves a date.\n  dateISO: entry.dateISO,\n  dateText: entry.dateText,\n  timeStatus: entry.timeStatus,\n  court: entry.court,\n  status: entry.status,\n  agendaSummary: conciseStatus(entry.status),\n  ongoing: entry.ongoing,\n  displayPriority: calendarDisplayPriority(entry),\n  hasExplainer: LIVE_EXPLAINER_IDS.has(entry.id),\n  sourceUrl: entry.src,\n  sourceLabel: entry.srcLabel,\n  link: entry.link,\n  linkText: entry.linkText,\n  explainerLinks: calendarLinksFor(entry),\n  book: CASE_BOOKS.get(entry.id) || null,\n}));\n\nconst searchCases = Array.from(new Map([\n  ...clientEntries.map((entry) => [entry.id, { id: entry.id, caseName: entry.caseName, dateISO: entry.dateISO }]),\n  ...calendar.appeals.map((entry) => [entry.id, { id: entry.id, caseName: entry.case }]),\n  ...calendar.unconfirmed.map((entry) => [entry.id, { id: entry.id, caseName: entry.case }]),\n  ...calendar.investigations.map((entry) => [entry.id, { id: entry.id, caseName: entry.case }]),\n  ...calendar.completed.map((entry) => [entry.id, { id: entry.id, caseName: entry.case }]),\n  ...international.monitoring.map((entry) => [entry.id, { id: entry.id, caseName: entry.case }]),\n  ...international.concluded.map((entry) => [entry.id, { id: entry.id, caseName: entry.case }]),\n]).values()).sort((a, b) => a.caseName.localeCompare(b.caseName));\n\nconst dateKey = (date) => date.toISOString().slice(0, 10);\nconst firstOfMonth = new Date(`${buildDate.slice(0, 7)}-01T00:00:00Z`);\n// The live month is a rolling view: its first row contains today in the\n// correct weekday column, then uses the remaining rows for future dates.\n// This avoids spending most of the calendar on dates readers can no longer use.\nconst todayForGrid = new Date(`${buildDate}T00:00:00Z`);\nconst gridStart = new Date(todayForGrid);\ngridStart.setUTCDate(todayForGrid.getUTCDate() - todayForGrid.getUTCDay());\nconst serverDays = Array.from({ length: 42 }, (_, index) => {\n  const date = new Date(gridStart);\n  date.setUTCDate(gridStart.getUTCDate() + index);\n  const key = dateKey(date);\n  return {\n    key,\n    day: date.getUTCDate(),\n    inMonth: date.getUTCMonth() === firstOfMonth.getUTCMonth(),\n    isPast: key < buildDate,\n    entries: clientEntries.filter((entry) => entry.dateISO === key),\n  };\n});\nconst initialSelectedDate = selectedEntry?.dateISO ?? buildDate;\nconst initialSelectedEntries = clientEntries.filter((entry) => entry.dateISO === initialSelectedDate);\nconst initialSelectedLabel = new Intl.DateTimeFormat('en-US', {\n  weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC',\n}).format(new Date(`${initialSelectedDate}T00:00:00Z`));\nconst initialMonthLabel = new Intl.DateTimeFormat('en-US', {\n  month: 'long', year: 'numeric', timeZone: 'UTC',\n}).format(firstOfMonth);\nconst trendPresentation = (score, hasExplainer = false) => {\n  const strength = Math.max(0, Math.min(1, score / 104));\n  const mix = (low, high) => Math.round(low + ((high - low) * strength));\n  return [\n    `font-size:${(9.4 + (strength * 3)).toFixed(2)}px`,\n    `font-weight:${Math.round(450 + (strength * 310))}`,\n    hasExplainer ? 'color:rgb(78 214 190)' : `color:rgb(${mix(138, 255)} ${mix(132, 111)} ${mix(124, 79)})`,\n  ].join(';');\n};\nconst visibleDayEntries = (entries) => {\n  const naturalTop = entries.slice(0, 4);\n  const highestExplainer = entries.find((entry) => entry.hasExplainer);\n  if (!highestExplainer || naturalTop.includes(highestExplainer)) return naturalTop;\n  return [...naturalTop.slice(0, 3), highestExplainer];\n};\n---\n\n<section class:list={['home-calendar', 'wrap', fullPage && 'home-calendar--full']} aria-labelledby=\"home-calendar-title\" data-home-calendar data-build-date={buildDate}>\n  <div class=\"home-calendar__top\">\n    <div class=\"home-calendar__heading\">\n      <div>\n        <p class=\"evidence evidence--accent\">Updated {lastUpdated}</p>\n        <CalendarHeading id=\"home-calendar-title\">Court Calendar</CalendarHeading>\n        {!fullPage && <p>Verified hearings, trials, and rulings worth following. Dates can change; each entry connects back to the public record and our related coverage.</p>}\n      </div>\n      {!fullPage && <a class=\"home-calendar__full-link\" href=\"/court-calendar/\">View the full calendar &rarr;</a>}\n    </div>\n\n    <div class=\"home-calendar__controls\" aria-label=\"Calendar controls\">\n      <div class=\"home-calendar__search-wrap\">\n        <input id={`calendar-case-search-${fullPage ? 'full' : 'home'}`} type=\"search\" aria-label=\"Search cases\" placeholder=\"Search cases\" list={`calendar-case-list-${fullPage ? 'full' : 'home'}`} autocomplete=\"off\" data-calendar-search />\n        <datalist id={`calendar-case-list-${fullPage ? 'full' : 'home'}`}>\n          {searchCases.map((entry) => <option value={entry.caseName}></option>)}\n        </datalist>\n      </div>\n      <h3 data-calendar-month aria-live=\"polite\">{initialMonthLabel}</h3>\n      <div class=\"home-calendar__controls-right\">\n        <button type=\"button\" class=\"home-calendar__month-button\" data-calendar-prev aria-label=\"Previous month\" disabled>&larr; <span>Previous</span></button>\n        <button type=\"button\" class=\"home-calendar__today\" data-calendar-today>Today</button>\n        <button type=\"button\" class=\"home-calendar__month-button\" data-calendar-next aria-label=\"Next month\"><span>Next</span> &rarr;</button>\n      </div>\n    </div>\n  </div>\n\n  <p class=\"calendar-legend\"><span><i class=\"calendar-dot\" data-link-type=\"free\" aria-hidden=\"true\"></i>FREE explainer</span> · <span><i class=\"calendar-dot\" data-link-type=\"paid\" aria-hidden=\"true\"></i>$ guide</span> · <span><i class=\"calendar-dot\" data-link-type=\"book\" aria-hidden=\"true\"></i>BOOK</span></p>\n  <div class=\"home-calendar__layout\">\n    <div class=\"home-calendar__month\" role=\"grid\" aria-labelledby=\"home-calendar-title\">\n      {ongoingNowEntries.length > 0 && (\n        <div class=\"home-calendar__ongoing\" aria-label=\"Trials currently underway\">\n          <span>Trials underway</span>\n          {ongoingNowEntries.map((entry) => (\n            <a href={`/court-calendar/#${entry.id}`}>{preferredCalendarLabels.get(entry.id) || entry.case.split(' — ')[0]}</a>\n          ))}\n        </div>\n      )}\n      <div class=\"home-calendar__weekdays\" role=\"row\">\n        {['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'].map((day) => (\n          <span role=\"columnheader\"><span class=\"home-calendar__day-wide\">{day}</span><span class=\"home-calendar__day-short\">{day.charAt(0)}</span></span>\n        ))}\n      </div>\n      <div class=\"home-calendar__days\" data-calendar-days>\n        {serverDays.map((day) => day.isPast ? (\n          <span class=\"home-calendar__day is-past\" aria-hidden=\"true\"></span>\n        ) : (\n          <button\n            type=\"button\"\n            class:list={[\n              'home-calendar__day',\n              !day.inMonth && 'is-outside',\n              day.key === buildDate && 'is-today',\n              day.key === initialSelectedDate && 'is-selected',\n              day.entries.length > 0 && 'has-events',\n            ]}\n            data-calendar-date={day.key}\n            aria-label={`${day.key}${day.entries.length ? `, ${day.entries.length} proceeding${day.entries.length > 1 ? 's' : ''}` : ''}${calendarLinkTypesFor(day.entries).length ? ', ' + calendarLinkTypesFor(day.entries).map((type) => ({free:'FREE explainer',paid:'paid guide',book:'BOOK'}[type])).join(', ') : ''}`}\n          >\n            <span class=\"home-calendar__day-number\">{day.day}</span>\n            <span class=\"calendar-day-types\" aria-hidden=\"true\">{calendarLinkTypesFor(day.entries).map((type) => <i class=\"calendar-dot\" data-link-type={type}></i>)}</span>\n            {visibleDayEntries(day.entries).map((entry) => (\n              <span class:list={['home-calendar__event-label', entry.hasExplainer && 'is-explainer', entry.timeStatus === 'tentative' && 'is-tentative']} data-trend-score={entry.displayPriority} style={trendPresentation(entry.displayPriority, entry.hasExplainer)}>\n                <span class=\"home-calendar__event-name\">{entry.calendarLabel}</span>\n                {entry.timeStatus === 'tentative' && <span class=\"home-calendar__event-status\">tentative</span>}\n              </span>\n            ))}\n          </button>\n        ))}\n      </div>\n    </div>\n\n    <aside class=\"home-calendar__agenda\" aria-labelledby=\"home-calendar-agenda-title\">\n      <p class=\"evidence evidence--accent\">Selected date</p>\n      <h3 id=\"home-calendar-agenda-title\" data-calendar-agenda-title>{initialSelectedLabel}</h3>\n      <div data-calendar-agenda aria-live=\"polite\">\n        {initialSelectedEntries.length > 0 ? initialSelectedEntries.map((entry) => (\n          <article class=\"home-calendar__agenda-item\" data-calendar-entry={entry.id}>\n            <p class=\"home-calendar__agenda-time\">{entry.dateText}</p>\n            {entry.timeStatus === 'tentative' && <p class=\"home-calendar__tentative\">Tentative &mdash; subject to confirmation</p>}\n            <h4>{entry.calendarLabel}</h4>\n            <p class=\"home-calendar__agenda-type\">{entry.proceeding}</p>\n            <p class=\"home-calendar__agenda-status\">{entry.agendaSummary}</p>\n            {entry.book && (\n              <aside class=\"home-calendar__book-promo\" aria-label={`Featured book: ${entry.book.title}`}>\n                <img src={entry.book.cover} alt={entry.book.coverAlt} width=\"1200\" height=\"1800\" loading=\"lazy\" />\n                <div class=\"home-calendar__book-copy\">\n                  <p class=\"home-calendar__book-eyebrow\">{entry.book.eyebrow}</p>\n                  <h5>{entry.book.title}</h5>\n                  <p class=\"home-calendar__book-tagline\">{entry.book.tagline}</p>\n                  <p class=\"home-calendar__book-offer\"><strong>{entry.book.price}</strong><span>{entry.book.format}</span></p>\n                  <a href={entry.book.url} target=\"_blank\" rel=\"noopener noreferrer\" data-book-key={entry.book.bookKey} data-cta-placement={entry.book.placement}>Get the trial guide <span aria-hidden=\"true\">&rarr;</span></a>\n                </div>\n              </aside>\n            )}\n            <p class=\"home-calendar__agenda-court\">{entry.court}</p>\n            <p class=\"home-calendar__agenda-source\"><span>Source:</span> <a href={entry.sourceUrl} target=\"_blank\" rel=\"noopener noreferrer\">{entry.sourceLabel}</a></p>\n            <div class=\"home-calendar__agenda-actions\">\n              {entry.explainerLinks.map((link) => <CalendarExplainerLink link={link} />)}\n              <a href={`/court-calendar/#${entry.id}`}>Calendar details &rarr;</a>\n              {fullPage ? (\n                <a href=\"#court-updates\">Get court calendar updates &rarr;</a>\n              ) : (\n                <>\n                  <button type=\"button\" data-calendar-alert>Get court calendar updates</button>\n                  {/* NEP-FIX-0824: the alert form lives in a JS-opened <dialog>. Without\n                      this no-JS anchor the calendar signup is unreachable when scripts\n                      fail or are blocked. */}\n                  <noscript><a class=\"home-calendar__alert-noscript\" href={CALENDAR_ALERT_URL} target=\"_blank\" rel=\"noopener noreferrer\">Get court calendar updates &rarr;</a></noscript>\n                </>\n              )}\n            </div>\n          </article>\n        )) : <p class=\"home-calendar__empty\">No tracked proceeding is currently scheduled for this date.</p>}\n      </div>\n      <p class=\"home-calendar__agenda-disclaimer\">All defendants are presumed innocent unless and until convicted. Court dates move&mdash;confirm with the court before traveling.</p>\n      <aside class=\"calendar-book-card\" data-calendar-book-card hidden={!initialSelectedEntries.some((entry) => entry.explainerLinks.some((link) => link.type === 'book'))} aria-label=\"Jury Chess book\">\n        <h4>Jury Chess: How Criminal Jury Trials Actually Work</h4>\n        <CalendarExplainerLink link={{ ...JURY_CHESS_LINK, placement: 'court_calendar_selected_date_footer' }} />\n      </aside>\n    </aside>\n  </div>\n\n  <script type=\"application/json\" data-calendar-json set:html={JSON.stringify(clientEntries)}></script>\n  <script type=\"application/json\" data-calendar-search-json set:html={JSON.stringify(searchCases)}></script>\n\n  {!fullPage && (\n    <dialog class=\"case-alert\" data-calendar-alert-dialog aria-labelledby=\"calendar-alert-title\">\n      <div class=\"case-alert__inner\">\n        <form method=\"dialog\" class=\"case-alert__close-form\">\n          <button type=\"submit\" class=\"case-alert__close\" aria-label=\"Close court calendar updates form\">&times;</button>\n        </form>\n        <p class=\"evidence evidence--accent\">Calendar alerts</p>\n        <h2 id=\"calendar-alert-title\">Get Court Calendar Updates</h2>\n        <p class=\"case-alert__copy\">Get a short email when we change a court date, time, location, or phase. No free guide. No daily emails.</p>\n        <div class=\"case-alert__embed-window\" data-case-alert-embed-window>\n          <iframe\n            class=\"case-alert__embed\"\n            data-calendar-alert-form\n            data-nep-campaign=\"court_calendar_updates\"\n            data-nep-conversion-page={Astro.url.pathname}\n            data-nep-cta-id=\"court_calendar_alert\"\n            data-nep-form-id={CALENDAR_ALERT_FORM_ID}\n            data-nep-offer-id=\"court_calendar_updates\"\n            data-form-base={`https://subscribe-forms.beehiiv.com/v3/forms/${CALENDAR_ALERT_FORM_ID}?utm_source=website&utm_medium=calendar_alert&utm_campaign=court_calendar_updates`}\n            title=\"Subscribe for court calendar updates\"\n            loading=\"lazy\"\n            scrolling=\"auto\"\n            frameborder=\"0\"\n          ></iframe>\n        </div>\n        <p class=\"case-alert__fallback\">Form not loading? <a data-calendar-alert-fallback data-nep-campaign=\"court_calendar_updates\" data-nep-conversion-page={Astro.url.pathname} data-nep-cta-id=\"court_calendar_alert_fallback\" data-nep-form-id={CALENDAR_ALERT_FORM_ID} data-nep-offer-id=\"court_calendar_updates\" href={`https://subscribe-forms.beehiiv.com/v3/forms/${CALENDAR_ALERT_FORM_ID}?utm_source=website&amp;utm_medium=calendar_alert&amp;utm_campaign=court_calendar_updates`} target=\"_blank\" rel=\"noopener noreferrer\">Get court calendar updates &rarr;</a></p>\n        <p class=\"case-alert__helper\">You can unsubscribe from any email.</p>\n        <p class=\"case-alert__success\" data-calendar-alert-success role=\"status\" hidden><strong>You&rsquo;re on the list.</strong> Watch your inbox for court calendar updates.</p>\n      </div>\n    </dialog>\n  )}\n</section>\n\n<script>\n  import { calendarLinkTypesFor } from '../data/calendar-explainer-links.mjs';\n  import { calendarSignupUrl } from '../scripts/calendar-signup-acquisition.mjs';\n  const root = document.querySelector('[data-home-calendar]');\n  if (root) {\n    const fullPage = root.classList.contains('home-calendar--full');\n    const entries = JSON.parse(root.querySelector('[data-calendar-json]')?.textContent || '[]');\n    const searchCases = JSON.parse(root.querySelector('[data-calendar-search-json]')?.textContent || '[]');\n    const buildDate = root.getAttribute('data-build-date');\n    const buildParts = buildDate.split('-').map(Number);\n    let shown = new Date(buildParts[0], buildParts[1] - 1, 1);\n    let selectedDate = entries.find((entry) => !entry.ongoing && entry.dateISO >= buildDate)?.dateISO || buildDate;\n    const monthLabel = root.querySelector('[data-calendar-month]');\n    const days = root.querySelector('[data-calendar-days]');\n    const agendaTitle = root.querySelector('[data-calendar-agenda-title]');\n    const agenda = root.querySelector('[data-calendar-agenda]');\n    const alertDialog = root.querySelector('[data-calendar-alert-dialog]');\n    const alertForm = root.querySelector('[data-calendar-alert-form]');\n    const alertFallback = root.querySelector('[data-calendar-alert-fallback]');\n    const alertSuccess = root.querySelector('[data-calendar-alert-success]');\n    const alertEmbedWindow = root.querySelector('[data-case-alert-embed-window]');\n    const previousButton = root.querySelector('[data-calendar-prev]');\n    const searchInput = root.querySelector('[data-calendar-search]');\n    const pad = (value) => String(value).padStart(2, '0');\n    const keyFor = (date) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;\n    const monthFormatter = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' });\n    const dateFormatter = new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric' });\n\n    function trendPresentation(score, hasExplainer = false) {\n      const strength = Math.max(0, Math.min(1, score / 104));\n      const mix = (low, high) => Math.round(low + ((high - low) * strength));\n      return [\n        `font-size:${(9.4 + (strength * 3)).toFixed(2)}px`,\n        `font-weight:${Math.round(450 + (strength * 310))}`,\n        hasExplainer ? 'color:rgb(78 214 190)' : `color:rgb(${mix(138, 255)} ${mix(132, 111)} ${mix(124, 79)})`,\n      ].join(';');\n    }\n\n    function visibleDayEntries(dateEntries) {\n      const naturalTop = dateEntries.slice(0, 4);\n      const highestExplainer = dateEntries.find((entry) => entry.hasExplainer);\n      if (!highestExplainer || naturalTop.includes(highestExplainer)) return naturalTop;\n      return [...naturalTop.slice(0, 3), highestExplainer];\n    }\n\n    function createActionLink(href, label) {\n      const link = document.createElement('a');\n      link.href = href;\n      link.textContent = `${label} →`;\n      return link;\n    }\n\n    function createBookPromo(book) {\n      const promo = document.createElement('aside');\n      promo.className = 'home-calendar__book-promo';\n      promo.setAttribute('aria-label', `Featured book: ${book.title}`);\n      const cover = document.createElement('img');\n      cover.src = book.cover;\n      cover.alt = book.coverAlt;\n      cover.width = 1200;\n      cover.height = 1800;\n      cover.loading = 'lazy';\n      const copy = document.createElement('div');\n      copy.className = 'home-calendar__book-copy';\n      const eyebrow = document.createElement('p');\n      eyebrow.className = 'home-calendar__book-eyebrow';\n      eyebrow.textContent = book.eyebrow;\n      const title = document.createElement('h5');\n      title.textContent = book.title;\n      const tagline = document.createElement('p');\n      tagline.className = 'home-calendar__book-tagline';\n      tagline.textContent = book.tagline;\n      const offer = document.createElement('p');\n      offer.className = 'home-calendar__book-offer';\n      const price = document.createElement('strong');\n      price.textContent = book.price;\n      const format = document.createElement('span');\n      format.textContent = book.format;\n      offer.append(price, format);\n      const cta = document.createElement('a');\n      cta.href = book.url;\n      cta.target = '_blank';\n      cta.rel = 'noopener noreferrer';\n      cta.dataset.bookKey = book.bookKey;\n      cta.dataset.ctaPlacement = book.placement;\n      cta.textContent = 'Get the trial guide →';\n      copy.append(eyebrow, title, tagline, offer, cta);\n      promo.append(cover, copy);\n      return promo;\n    }\n\n    function openAlert() {\n      if (!alertDialog || !alertForm || !alertFallback) return;\n      const formUrl = calendarSignupUrl(alertForm.getAttribute('data-form-base'), window.NEP_ORIGIN);\n      alertForm.src = formUrl;\n      alertFallback.href = formUrl;\n      alertSuccess.hidden = true;\n      alertEmbedWindow.hidden = false;\n      alertDialog.showModal();\n      if (typeof window.gtag === 'function') {\n        window.gtag('event', 'calendar_alert_open', { page_path: location.pathname });\n      }\n    }\n\n    function renderAgenda(key) {\n      selectedDate = key;\n      const date = new Date(`${key}T12:00:00`);\n      agendaTitle.textContent = dateFormatter.format(date);\n      agenda.replaceChildren();\n      const selectedEntries = entries\n        .filter((entry) => entry.dateISO === key)\n        .sort((a, b) => b.displayPriority - a.displayPriority || a.caseName.localeCompare(b.caseName));\n      const bookCard = root.querySelector('[data-calendar-book-card]');\n      if (bookCard) bookCard.hidden = !selectedEntries.some((entry) => entry.explainerLinks.some((link) => link.type === 'book'));\n      if (!selectedEntries.length) {\n        const empty = document.createElement('p');\n        empty.className = 'home-calendar__empty';\n        empty.textContent = 'No tracked proceeding is currently scheduled for this date.';\n        agenda.append(empty);\n        return;\n      }\n      selectedEntries.forEach((entry) => {\n        const article = document.createElement('article');\n        article.className = 'home-calendar__agenda-item';\n        article.dataset.calendarEntry = entry.id;\n        const dateText = document.createElement('p');\n        dateText.className = 'home-calendar__agenda-time';\n        dateText.textContent = entry.dateText;\n        const tentative = document.createElement('p');\n        tentative.className = 'home-calendar__tentative';\n        tentative.textContent = 'Tentative — subject to confirmation';\n        const title = document.createElement('h4');\n        title.textContent = entry.calendarLabel;\n        const type = document.createElement('p');\n        type.className = 'home-calendar__agenda-type';\n        type.textContent = entry.proceeding;\n        const status = document.createElement('p');\n        status.className = 'home-calendar__agenda-status';\n        status.textContent = entry.agendaSummary;\n        const court = document.createElement('p');\n        court.className = 'home-calendar__agenda-court';\n        court.textContent = entry.court;\n        const source = document.createElement('p');\n        source.className = 'home-calendar__agenda-source';\n        const sourcePrefix = document.createElement('span');\n        sourcePrefix.textContent = 'Source: ';\n        const sourceLink = createActionLink(entry.sourceUrl, entry.sourceLabel);\n        sourceLink.textContent = entry.sourceLabel;\n        sourceLink.target = '_blank';\n        sourceLink.rel = 'noopener noreferrer';\n        source.append(sourcePrefix, sourceLink);\n        const actions = document.createElement('div');\n        actions.className = 'home-calendar__agenda-actions';\n        for (const link of entry.explainerLinks) {\n          const action = createActionLink(link.url, link.text);\n          action.className = 'calendar-resource';\n          action.dataset.linkType = link.type;\n          const badge = document.createElement('span');\n          badge.className = 'calendar-badge';\n          badge.dataset.linkType = link.type;\n          badge.textContent = link.badge;\n          const label = document.createElement('span');\n          label.textContent = action.textContent;\n          action.replaceChildren(badge, label);\n          if (link.bookKey) action.dataset.bookKey = link.bookKey;\n          if (link.placement) action.dataset.ctaPlacement = link.placement;\n          if (link.paid) {\n            action.target = '_blank';\n            action.rel = 'noopener noreferrer';\n            action.dataset.bookKey = link.bookKey;\n            action.dataset.ctaPlacement = link.placement;\n          }\n          actions.append(action);\n        }\n        actions.append(createActionLink(`/court-calendar/#${entry.id}`, 'Calendar details'));\n        if (fullPage) {\n          actions.append(createActionLink('#court-updates', 'Get court calendar updates'));\n        } else {\n          const alertButton = document.createElement('button');\n          alertButton.type = 'button';\n          alertButton.textContent = 'Get court calendar updates';\n          alertButton.addEventListener('click', openAlert);\n          actions.append(alertButton);\n        }\n        article.append(dateText);\n        if (entry.timeStatus === 'tentative') article.append(tentative);\n        article.append(title, type, status);\n        if (entry.book) article.append(createBookPromo(entry.book));\n        article.append(court, source, actions);\n        agenda.append(article);\n      });\n    }\n\n    function renderMonth() {\n      monthLabel.textContent = monthFormatter.format(shown);\n      const currentMonth = new Date(buildParts[0], buildParts[1] - 1, 1);\n      if (previousButton) previousButton.disabled = shown <= currentMonth;\n      const isCurrentMonth = shown.getFullYear() === buildParts[0] && shown.getMonth() === buildParts[1] - 1;\n      const first = isCurrentMonth\n        ? new Date(buildParts[0], buildParts[1] - 1, buildParts[2])\n        : new Date(shown.getFullYear(), shown.getMonth(), 1);\n      const start = new Date(first.getFullYear(), first.getMonth(), first.getDate() - first.getDay());\n      days.replaceChildren();\n      for (let index = 0; index < 42; index += 1) {\n        const date = new Date(start);\n        date.setDate(start.getDate() + index);\n        const key = keyFor(date);\n        const dateEntries = entries\n          .filter((entry) => entry.dateISO === key)\n          .sort((a, b) => b.displayPriority - a.displayPriority || a.caseName.localeCompare(b.caseName));\n        if (key < buildDate) {\n          const blank = document.createElement('span');\n          blank.className = 'home-calendar__day is-past';\n          blank.setAttribute('aria-hidden', 'true');\n          days.append(blank);\n          continue;\n        }\n        const button = document.createElement('button');\n        button.type = 'button';\n        button.className = 'home-calendar__day';\n        button.setAttribute('data-calendar-date', key);\n        if (date.getMonth() !== shown.getMonth()) button.classList.add('is-outside');\n        if (key === keyFor(new Date())) button.classList.add('is-today');\n        if (key === selectedDate) button.classList.add('is-selected');\n        if (dateEntries.length) button.classList.add('has-events');\n        button.setAttribute('role', 'gridcell');\n        button.setAttribute('aria-label', `${dateFormatter.format(date)}${dateEntries.length ? `, ${dateEntries.length} proceeding${dateEntries.length > 1 ? 's' : ''}` : ''}`);\n        const linkTypes = calendarLinkTypesFor(dateEntries);\n        if (linkTypes.length) button.setAttribute('aria-label', button.getAttribute('aria-label') + ', ' + linkTypes.map((type) => ({free:'FREE explainer',paid:'paid guide',book:'BOOK'}[type])).join(', '));\n        const dots = document.createElement('span');\n        dots.className = 'calendar-day-types';\n        dots.setAttribute('aria-hidden', 'true');\n        for (const type of linkTypes) {\n          const dot = document.createElement('i');\n          dot.className = 'calendar-dot';\n          dot.dataset.linkType = type;\n          dots.append(dot);\n        }\n        const number = document.createElement('span');\n        number.className = 'home-calendar__day-number';\n        number.textContent = String(date.getDate());\n        button.append(number, dots);\n        visibleDayEntries(dateEntries).forEach((entry) => {\n          const label = document.createElement('span');\n          label.className = 'home-calendar__event-label';\n          if (entry.hasExplainer) label.classList.add('is-explainer');\n          if (entry.timeStatus === 'tentative') label.classList.add('is-tentative');\n          label.dataset.trendScore = String(entry.displayPriority);\n          label.style.cssText = trendPresentation(entry.displayPriority, entry.hasExplainer);\n          const eventName = document.createElement('span');\n          eventName.className = 'home-calendar__event-name';\n          eventName.textContent = entry.calendarLabel;\n          label.append(eventName);\n          if (entry.timeStatus === 'tentative') {\n            const eventStatus = document.createElement('span');\n            eventStatus.className = 'home-calendar__event-status';\n            eventStatus.textContent = 'tentative';\n            label.append(eventStatus);\n          }\n          button.append(label);\n        });\n        button.addEventListener('click', () => {\n          renderAgenda(key);\n          renderMonth();\n        });\n        days.append(button);\n      }\n    }\n\n    function openSearchResult() {\n      if (!searchInput) return;\n      const query = searchInput.value.trim().toLocaleLowerCase();\n      if (!query) return;\n      const match = searchCases.find((entry) => entry.caseName.toLocaleLowerCase() === query)\n        || searchCases.find((entry) => entry.caseName.toLocaleLowerCase().startsWith(query))\n        || searchCases.find((entry) => entry.caseName.toLocaleLowerCase().includes(query));\n      if (!match) {\n        searchInput.setCustomValidity('No tracked case matches that search.');\n        searchInput.reportValidity();\n        return;\n      }\n      searchInput.setCustomValidity('');\n      searchInput.value = match.caseName;\n      if (match.dateISO && match.dateISO >= buildDate) {\n        const [year, month] = match.dateISO.split('-').map(Number);\n        shown = new Date(year, month - 1, 1);\n        renderAgenda(match.dateISO);\n        renderMonth();\n        return;\n      }\n      document.getElementById(match.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });\n    }\n\n    previousButton?.addEventListener('click', () => {\n      const currentMonth = new Date(buildParts[0], buildParts[1] - 1, 1);\n      if (shown <= currentMonth) return;\n      shown = new Date(shown.getFullYear(), shown.getMonth() - 1, 1);\n      renderMonth();\n    });\n    root.querySelector('[data-calendar-next]')?.addEventListener('click', () => {\n      shown = new Date(shown.getFullYear(), shown.getMonth() + 1, 1);\n      renderMonth();\n    });\n    root.querySelector('[data-calendar-today]')?.addEventListener('click', () => {\n      const today = new Date();\n      shown = new Date(today.getFullYear(), today.getMonth(), 1);\n      renderAgenda(keyFor(today));\n      renderMonth();\n    });\n    searchInput?.addEventListener('input', () => searchInput.setCustomValidity(''));\n    searchInput?.addEventListener('change', openSearchResult);\n    searchInput?.addEventListener('keydown', (event) => {\n      if (event.key === 'Enter') {\n        event.preventDefault();\n        openSearchResult();\n      }\n    });\n    if (!fullPage) {\n      root.querySelectorAll('[data-calendar-alert]').forEach((button) => button.addEventListener('click', openAlert));\n      alertDialog?.addEventListener('click', (event) => {\n        if (event.target === alertDialog) alertDialog.close();\n      });\n      alertForm?.addEventListener('load', () => {\n        let href;\n        try { href = alertForm.contentWindow.location.href; } catch (error) { return; }\n        if (!href || !href.includes('subscribed=1')) return;\n        alertEmbedWindow.hidden = true;\n        alertSuccess.hidden = false;\n      });\n    }\n    renderMonth();\n  }\n</script>\n\n<style is:global>\n  .home-calendar{margin:38px auto 14px;padding:30px;background:var(--bg-2);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;box-shadow:var(--shadow)}\n  .home-calendar--full{max-width:1440px;margin-top:8px;padding:14px 24px 26px}\n  .home-calendar__heading{display:flex;align-items:end;justify-content:space-between;gap:28px}\n  .home-calendar__heading h1,.home-calendar__heading h2{font-family:var(--serif);font-size:clamp(34px,5vw,48px);line-height:1;margin:0 0 8px}\n  .home-calendar__heading>div>p:last-child{max-width:72ch;margin:0;color:var(--ink-2);line-height:1.55}\n  .home-calendar--full .home-calendar__heading{align-items:center}\n  .home-calendar--full .home-calendar__heading>div{display:flex;align-items:baseline;gap:16px}\n  .home-calendar--full .home-calendar__heading h1{margin:0;font-size:27px}\n  .home-calendar--full .home-calendar__heading .evidence{margin:0;order:2;letter-spacing:.12em}\n  .home-calendar--full .home-calendar__top{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:24px;padding-bottom:9px;border-bottom:1px solid var(--line)}\n  .home-calendar--full .home-calendar__controls{grid-template-columns:minmax(150px,220px) minmax(130px,1fr) auto;margin:0;padding:0;border:0}\n  .home-calendar__full-link{flex:0 0 auto;color:var(--accent);font-family:var(--mono);font-size:12px;text-decoration:none}\n  .home-calendar__controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:10px;padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n  .home-calendar__controls h3{margin:0;font-family:var(--serif);font-size:24px;text-align:center}\n  .home-calendar__controls button{border:0;background:transparent;color:var(--ink-2);cursor:pointer;font:inherit;padding:8px}\n  .home-calendar__controls button:disabled{visibility:hidden;cursor:default}\n  .home-calendar__search-wrap{display:flex;align-items:center;justify-self:start;width:min(230px,100%)}\n  .home-calendar__search-wrap input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:12px}\n  .home-calendar__search-wrap input::placeholder{color:var(--ink-3)}\n  .home-calendar__controls-right{display:flex;justify-content:flex-end;gap:12px}\n  .home-calendar__today{font-family:var(--mono)!important;font-size:11px!important;text-transform:uppercase}\n  .home-calendar__layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;margin-top:20px}\n  .home-calendar--full .home-calendar__layout{margin-top:10px}\n  .home-calendar__ongoing{display:flex;align-items:center;gap:9px;margin:0 0 9px;padding:7px 9px;border:1px solid rgba(232,93,61,.32);border-radius:7px;background:rgba(232,93,61,.055);overflow-x:auto;white-space:nowrap}\n  .home-calendar__ongoing>span{color:var(--accent);font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}\n  .home-calendar__ongoing a{color:var(--ink-2);font-size:11px;text-decoration:none}\n  .home-calendar__ongoing a+a::before{margin-right:9px;color:var(--ink-3);content:'\\00b7'}\n  .home-calendar__weekdays,.home-calendar__days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}\n  .home-calendar__weekdays>span{padding:0 5px 8px;color:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-align:center;text-transform:uppercase}\n  .home-calendar__day-short{display:none}\n  .home-calendar__day{min-height:94px;padding:8px;border:0;border-top:1px solid var(--line);border-right:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;text-align:left;overflow:hidden}\n  .home-calendar--full .home-calendar__day{min-height:124px;padding:9px}\n  .home-calendar__day:nth-child(7n+1){border-left:1px solid var(--line)}\n  .home-calendar__day:nth-last-child(-n+7){border-bottom:1px solid var(--line)}\n  .home-calendar__day:hover{background:rgba(232,93,61,.06)}\n  .home-calendar__day.is-outside{color:var(--ink-3);opacity:1}\n  .home-calendar__day.is-past{cursor:default}\n  .home-calendar__day.is-selected{background:rgba(232,93,61,.1);box-shadow:inset 0 0 0 2px var(--accent)}\n  .home-calendar__day.is-today .home-calendar__day-number{display:inline-grid;width:25px;height:25px;place-items:center;border-radius:50%;background:var(--ink);color:var(--bg)}\n  .home-calendar__day-number{font-family:var(--mono);font-size:11px}\n  .home-calendar__event-label{display:block;margin-top:6px;color:var(--ink-3);font-size:9.4px;font-weight:450;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .home-calendar__event-label+.home-calendar__event-label{margin-top:4px}\n  .home-calendar__event-label.is-tentative{color:rgb(214 172 92)!important}\n  .home-calendar__event-name{font-size:1em}\n  .home-calendar__event-status{margin-left:5px;color:rgb(214 172 92);font-size:.7em;font-style:italic;font-weight:500;letter-spacing:.02em}\n  .home-calendar__agenda{padding-left:24px;border-left:1px solid var(--line)}\n  .home-calendar__agenda>h3{margin:0 0 17px;font-family:var(--serif);font-size:28px;line-height:1.05}\n  .home-calendar__agenda-item{padding:16px 0;border-top:1px solid var(--line)}\n  .home-calendar__agenda-item:first-child{border-top-color:var(--accent)}\n  .home-calendar__agenda-time{margin:0 0 7px;color:var(--accent);font-family:var(--mono);font-size:10px;line-height:1.4;text-transform:uppercase}\n  .home-calendar__tentative{margin:-2px 0 8px;color:rgb(214 172 92);font-family:var(--mono);font-size:9px;font-style:italic;letter-spacing:.05em;text-transform:uppercase}\n  .home-calendar__agenda-item h4{margin:0 0 4px;font-family:var(--serif);font-size:21px;line-height:1.1}\n  .home-calendar__agenda-type{margin:0 0 6px;color:var(--ink-2);font-size:13px;line-height:1.4}\n  .home-calendar__agenda-status{margin:0 0 9px;color:var(--ink-2);font-size:11.5px;line-height:1.5}\n  .home-calendar__book-promo{position:relative;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;margin:14px 0 16px;padding:12px;border:1px solid rgba(214,172,92,.58);border-radius:10px;background:linear-gradient(145deg,rgba(214,172,92,.16),rgba(18,15,13,.98) 58%);box-shadow:0 12px 28px rgba(0,0,0,.28);overflow:hidden}\n  .home-calendar__book-promo::after{position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,#d6ac5c,#f2d49a,transparent);content:\"\"}\n  .home-calendar__book-promo img{display:block;width:76px;height:auto;aspect-ratio:2/3;border:1px solid rgba(242,212,154,.42);border-radius:4px;object-fit:cover;box-shadow:0 7px 18px rgba(0,0,0,.48)}\n  .home-calendar__book-copy{min-width:0}\n  .home-calendar__book-eyebrow{margin:1px 0 4px;color:#e6bd6d;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}\n  .home-calendar__book-copy h5{margin:0 0 5px;color:#fff4df;font-family:var(--serif);font-size:17px;line-height:1.08}\n  .home-calendar__book-tagline{margin:0 0 8px;color:var(--ink-2);font-size:10px;line-height:1.38}\n  .home-calendar__book-offer{display:flex;align-items:center;gap:7px;margin:0 0 8px;color:#f2d49a;font-size:10px}\n  .home-calendar__book-offer strong{font-family:var(--serif);font-size:16px;line-height:1}\n  .home-calendar__book-offer span{padding-left:7px;border-left:1px solid rgba(214,172,92,.45);font-family:var(--mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase}\n  .home-calendar__book-copy>a{display:block;padding:8px 10px;border-radius:6px;background:#e85d3d;color:#fff7ee;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.035em;text-align:center;text-decoration:none;text-transform:uppercase;box-shadow:0 5px 14px rgba(232,93,61,.22)}\n  .home-calendar__book-copy>a:hover{background:#f06d4d}\n  .home-calendar__book-copy>a:focus-visible{outline:2px solid #f2d49a;outline-offset:3px}\n  .home-calendar__agenda-court{margin:0 0 12px;color:var(--ink-3);font-size:11px;line-height:1.4}\n  .home-calendar__agenda-source{margin:0 0 12px;color:var(--ink-3);font-size:10px;line-height:1.45}\n  .home-calendar__agenda-source span{font-family:var(--mono);text-transform:uppercase}\n  .home-calendar__agenda-source a{color:var(--ink-2);text-decoration-color:rgba(214,172,92,.55);text-underline-offset:2px}\n  .home-calendar__agenda-actions{display:flex;flex-direction:column;align-items:flex-start;gap:8px}\n  .home-calendar__agenda-actions a,.home-calendar__agenda-actions button{border:0;background:transparent;color:var(--ink-2);cursor:pointer;font:inherit;font-size:12px;padding:0;text-decoration:none;text-align:left}\n  .home-calendar__agenda-actions button{color:var(--accent);font-weight:700}\n  .home-calendar__empty{color:var(--ink-3);font-size:13px;line-height:1.5}\n  .home-calendar__agenda-disclaimer{margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line);color:var(--ink-3);font-family:var(--mono);font-size:9px;line-height:1.5}\n  .case-alert{width:min(620px,calc(100% - 28px));max-height:calc(100dvh - 28px);overflow:auto;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);color:var(--ink);box-shadow:0 28px 90px rgba(0,0,0,.7)}\n  .case-alert::backdrop{background:rgba(7,5,4,.78)}\n  .case-alert__inner{position:relative;padding:30px}\n  .case-alert__close-form{position:absolute;top:12px;right:12px;margin:0}\n  .case-alert__close{width:44px;height:44px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;font-size:28px;line-height:1}\n  .case-alert h2{margin:0 40px 10px 0;font-family:var(--serif);font-size:34px;line-height:1.08}\n  .case-alert__copy{margin:0;color:var(--ink-2);line-height:1.55}\n  /* Keep the whole provider form reachable, including optional preferences,\n     validation messages and confirmation. Provider content can scroll. */\n  .case-alert__embed-window{width:100%;height:auto;margin-top:20px;overflow:hidden}\n  /* Compensate only the provider's 80px side gutters, never its content rows. */\n  .case-alert__embed{display:block;position:static;width:calc(100% + 160px);max-width:none;margin-left:-80px;height:clamp(360px,60dvh,520px);border:0}\n  @media(max-width:430px){.case-alert__inner{padding:16px}.case-alert h2{font-size:28px}}\n  .case-alert__fallback,.case-alert__helper{margin:10px 0 0;color:var(--ink-3);font-size:11px;line-height:1.45}\n  .home-calendar__alert-noscript{color:var(--accent)}\n  .case-alert__fallback a{color:var(--accent)}\n  .case-alert__success{margin:20px 0 0;padding:14px;border-left:3px solid var(--accent);background:rgba(232,93,61,.08)}\n  @media(max-width:760px){\n    .home-calendar{margin-top:24px;padding:22px 14px}\n    .home-calendar--full{margin-top:8px;padding:12px}\n    .home-calendar__heading{align-items:flex-start;flex-direction:column;gap:12px}\n    .home-calendar--full .home-calendar__heading>div{display:block}\n    .home-calendar--full .home-calendar__heading h1{font-size:28px}\n    .home-calendar--full .home-calendar__heading .evidence{margin:0 0 4px}\n    .home-calendar--full .home-calendar__top{display:block;padding-bottom:8px}\n    .home-calendar--full .home-calendar__controls{margin-top:8px}\n    .home-calendar__controls{grid-template-columns:1fr auto;gap:8px}\n    .home-calendar__controls h3{grid-column:1/-1;grid-row:1}\n    .home-calendar__search-wrap{grid-column:1;grid-row:2;width:100%}\n    .home-calendar__controls-right{grid-column:2;grid-row:2;gap:4px}\n    .home-calendar__controls button span{display:none}\n    .home-calendar__today{display:inline-block!important;padding:7px 4px!important}\n    .home-calendar__controls h3{font-size:21px}\n    .home-calendar__layout{grid-template-columns:minmax(0,1fr)}\n    .home-calendar__ongoing{gap:7px;margin-bottom:7px;padding:6px 7px}\n    .home-calendar__ongoing a{font-size:10px}\n    .home-calendar__agenda{padding:20px 0 0;border-top:1px solid var(--line);border-left:0}\n    .home-calendar__book-promo{grid-template-columns:88px minmax(0,1fr);gap:14px;padding:14px}\n    .home-calendar__book-promo img{width:88px}\n    .home-calendar__book-copy h5{font-size:20px}\n    .home-calendar__book-tagline{font-size:11px}\n    .home-calendar__book-copy>a{font-size:10px}\n    .home-calendar__day-wide{display:none}\n    .home-calendar__day-short{display:inline}\n    .home-calendar__day,.home-calendar--full .home-calendar__day{min-height:58px;padding:5px;text-align:center}\n    .home-calendar__event-label{display:none}\n    .home-calendar__day.has-events:not(:has(.calendar-dot))::after{display:block;width:5px;height:5px;margin:5px auto 0;border-radius:50%;background:var(--accent);content:\"\"}\n    .case-alert__inner{padding:24px 18px}\n    .case-alert h2{font-size:29px}\n  }\n  @media(prefers-reduced-motion:reduce){.home-calendar__day{scroll-behavior:auto}}\n</style>\n","scripts/check-calendar-link-ui.mjs":"import assert from 'node:assert/strict';\nimport { readFileSync, mkdirSync, writeFileSync } from 'node:fs';\nimport { execFileSync } from 'node:child_process';\nimport { chromium } from 'playwright';\nimport { calendarLinksFor, calendarLinkTypesFor, JURY_CHESS_EXCLUDED_IDS } from '../src/data/calendar-explainer-links.mjs';\nimport { parseCourtCalendar } from '../src/data/court-calendar-parser.mjs';\nconst base = 'c7b88e81cf803f05e5f45b5bc48e6f3456f7544b';\nfor (const path of ['src/data/court-calendar.tsv','src/data/court-calendar-archive.tsv','src/data/international-watch.tsv']) {\n  assert.equal(readFileSync(path,'utf8'),execFileSync('git',['show',base+':'+path],{encoding:'utf8'}),path);\n}\nconst c = parseCourtCalendar(readFileSync('src/data/court-calendar.tsv','utf8'));\nconst all = [...c.entries,...c.appeals,...c.unconfirmed,...c.investigations,...c.completed];\nconst bookEntries = all.filter(e=>calendarLinksFor(e).some(l=>l.type==='book')).map(e=>({id:e.id,case:e.case,event:e.proceeding}));\nmkdirSync('cal05-receipts',{recursive:true});\nconst browser = await chromium.launch();\nconst summaries=[];\nconst builtPageBadges = {};\nconst lum = hex => {\n  const c=hex.match(/\\w\\w/g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);\n  return c[0]*.2126+c[1]*.7152+c[2]*.0722;\n};\nconst contrast=(a,b)=>(Math.max(lum(a),lum(b))+.05)/(Math.min(lum(a),lum(b))+.05);\nconst colors={free:'86efac',paid:'f6c76b',book:'d8b4fe'};\nconst ratios=Object.fromEntries(Object.entries(colors).map(([k,v])=>[k,contrast(v,'14110f')]));\nfor(const r of Object.values(ratios)) assert.ok(r>=4.5);\nfor (const width of [1280,390]) {\n  const context = await browser.newContext({viewport:{width,height:1000}});\n  const page=await context.newPage();\n  const errors=[];\n  page.on('pageerror',e=>errors.push(e.message));\n  for(const route of ['/court-calendar/','/']) {\n    await page.goto('http://127.0.0.1:4321'+route,{waitUntil:'networkidle'});\n    await page.waitForSelector('[data-calendar-days] button');\n    assert.equal((await page.locator('.calendar-legend').innerText()).replace(/\\s+/g,' ').trim(),'FREE explainer · $ guide · BOOK');\n    assert.equal(await page.locator('.calendar-book-card').count(),1);\n    assert.equal(await page.locator('.calendar-book-card').isVisible(),(await page.locator('[data-calendar-agenda] .calendar-resource[data-link-type=\"book\"]').count()) > 0);\n    assert.equal(await page.locator('.home-calendar__agenda-disclaimer').evaluate(n=>n.nextElementSibling?.classList.contains('calendar-book-card')),true);\n    assert.equal(await page.locator('.calendar-book-card a').getAttribute('href'),'https://cassiancreed.com/books/');\n    const raw=JSON.parse(await page.locator('[data-calendar-json]').textContent());\n    const buildDate=await page.locator('[data-home-calendar]').getAttribute('data-build-date');\n    const checkLinks=async (scope,expected,label)=>{\n      const actual=await scope.locator('a.calendar-resource').evaluateAll(ns=>ns.map(n=>[n.getAttribute('href'),n.dataset.linkType,n.querySelector('.calendar-badge')?.textContent,n.querySelector('span:last-child')?.textContent.trim()]));\n      assert.deepEqual(actual,expected.map(l=>[l.url,l.type,l.badge,l.text+' →']),label);\n      assert.deepEqual(await scope.locator('.calendar-resource').evaluateAll(ns=>ns.filter(n=>n.scrollWidth>n.clientWidth+2).map(n=>n.textContent)),[],label+' clipping');\n    };\n    let detailCount=0,listCount=0,selectedCount=0,dotCount=0;\n    if(route==='/court-calendar/') {\n      for(const e of all) {\n        const detail=page.locator('[id=\"'+e.id+'\"]');\n        if(!await detail.count()) continue;\n        const scope=detail.locator('.row__links,.card__links').first();\n        if(await scope.count()){\n          const expected = calendarLinksFor(e);\n          await checkLinks(scope,expected,'detail '+e.id);\n          if(e.id !== 'mary-collins-trial') assert.equal(await scope.locator('.card__soon').count(),expected.every(link=>link.type==='book') ? 1 : 0,'case-file fallback '+e.id);\n          detailCount++;\n        }\n        const index=page.locator('[data-calendar-list-entry=\"'+e.id+'\"]');\n        if(await index.count()){await checkLinks(index,calendarLinksFor(e),'list '+e.id);listCount++;}\n      }\n    }\n    const nojs=await browser.newContext({javaScriptEnabled:false,viewport:{width,height:1000}});\n    const server=await nojs.newPage();\n    await server.goto('http://127.0.0.1:4321'+route);\n    if(width === 1280) {\n      builtPageBadges[route] = {};\n      for(const type of ['free','paid','book']) {\n        const badges = server.locator('.calendar-badge[data-link-type=\"'+type+'\"]');\n        builtPageBadges[route][type] = {total:await badges.count(), visible:await badges.evaluateAll(ns=>ns.filter(n=>n.getClientRects().length>0).length)};\n      }\n    }\n    for(const e of raw) {\n      const item=server.locator('[data-calendar-agenda] [data-calendar-entry=\"'+e.id+'\"]');\n      if(await item.count()) await checkLinks(item,e.explainerLinks,'SSR '+e.id);\n    }\n    const dates=[...new Set(raw.filter(e=>e.dateISO>=buildDate).map(e=>e.dateISO))].sort();\n    for(const date of dates){\n      let attempts=0;\n      while(!await page.locator('[data-calendar-date=\"'+date+'\"]').count() && attempts++<24) await page.locator('[data-calendar-next]').click();\n      const day=page.locator('[data-calendar-date=\"'+date+'\"]');\n      assert.equal(await day.count(),1,date);\n      const dayEntries=raw.filter(e=>e.dateISO===date);\n      const expectedTypes=calendarLinkTypesFor(dayEntries);\n      assert.deepEqual(await day.locator('.calendar-dot').evaluateAll(ns=>ns.map(n=>n.dataset.linkType)),expectedTypes,'dots '+date);\n      assert.deepEqual(await day.locator('.calendar-dot').evaluateAll(ns=>ns.filter(n=>{const r=n.getBoundingClientRect();return r.width<5||r.height<5}).map(n=>n.dataset.linkType)),[],'visible dots');\n      const aria=await day.getAttribute('aria-label');\n      for(const type of expectedTypes) assert.ok(aria.includes({free:'FREE explainer',paid:'paid guide',book:'BOOK'}[type]),'accessible dot '+date);\n      dotCount++;\n      await day.click();\n      assert.equal(await page.locator('.calendar-book-card').isVisible(),dayEntries.some(entry=>entry.explainerLinks.some(link=>link.type==='book')));\n      for(const e of dayEntries) {\n        const item=page.locator('[data-calendar-agenda] [data-calendar-entry=\"'+e.id+'\"]');\n        assert.equal(await item.count(),1,e.id);\n        await checkLinks(item,e.explainerLinks,'selected '+e.id);\n        selectedCount++;\n      }\n    }\n    // Select a real empty day, then return to today. BOOK card must hide on empty dates.\n    await page.locator('[data-calendar-today]').click();\n    const emptyDay = page.locator('[data-calendar-date]:not(.has-events)').first();\n    assert.ok(await emptyDay.count());\n    await emptyDay.click();\n    assert.equal(await page.locator('.calendar-book-card').isVisible(),false);\n    await page.locator('[data-calendar-today]').click();\n    assert.equal(await page.locator('.calendar-book-card').count(),1);\n    assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2),false,'page width '+width+' '+route);\n    const badgeColors=await page.locator('.calendar-badge').evaluateAll(ns=>ns.map(n=>({type:n.dataset.linkType,color:getComputedStyle(n).color,bg:getComputedStyle(n).backgroundColor,fontSize:getComputedStyle(n).fontSize})));\n    for(const b of badgeColors){\n      assert.equal(b.fontSize,'11px');\n      assert.equal(b.color,'rgb(20, 17, 15)');\n      assert.equal(b.bg,{free:'rgb(134, 239, 172)',paid:'rgb(246, 199, 107)',book:'rgb(216, 180, 254)'}[b.type]);\n    }\n    await page.screenshot({path:'cal05-receipts/'+(route==='/'?'home':'calendar')+'-'+width+'.png',fullPage:route==='/'});\n    summaries.push({width,route,detailCount,listCount,selectedCount,dotCount,serverRendering:'passed',colors:'passed',overflow:'none'});\n    await nojs.close();\n  }\n  assert.deepEqual(errors,[]);\n  await context.close();\n}\nawait browser.close();\nconst receipt={base,commit:process.env.GITHUB_SHA,checkedAt:new Date().toISOString(),unchangedTsvs:true,legend:'FREE explainer · $ guide · BOOK',badgeText:'#14110f',colors,contrastRatios:ratios,bookEntryCount:bookEntries.length,newBookEntryCount:bookEntries.length-1,excludedBookIds:[...JURY_CHESS_EXCLUDED_IDS],bookEntries,builtPageBadges,summaries};\nwriteFileSync('cal05-receipts/audit.json',JSON.stringify(receipt,null,2));\nconsole.log('CAL05_AUDIT '+JSON.stringify(receipt));\n","src/components/CalendarExplainerLink.astro":"---\nimport '../styles/calendar-explainer-links.css';\nimport { classifyCalendarLink } from '../data/calendar-explainer-links.mjs';\nconst { link: rawLink, id } = Astro.props;\nconst link = classifyCalendarLink(rawLink);\n---\n<a id={id} class=\"calendar-resource\" data-link-type={link.type} href={link.url} target={link.paid ? '_blank' : undefined} rel={link.paid ? 'noopener noreferrer' : undefined} data-book-key={link.bookKey} data-cta-placement={link.placement}><span class=\"calendar-badge\" data-link-type={link.type}>{link.badge}</span><span>{link.text} &rarr;</span></a>\n\n","src/data/calendar-explainer-links.mjs":"// NEP-20261018-CAL-04: reviewed case matches shared by every calendar surface.\n// Only live, priced products and non-archived published posts are eligible.\n// Source dates, court times, notes and legal posture remain in the original TSVs.\nconst EXISTING_CASE_GUIDES = {\n  'burke-prelim': {\n    url: 'https://cassiancreed.beehiiv.com/products/celeste-rivas-hernandez-d4vd-charges-guide?utm_source=cassiancreed.com&utm_medium=court_calendar&utm_campaign=explainer_d4vd_v2&utm_content=status_entry',\n    text: 'Read the Celeste Rivas Hernandez case guide — the D4vd charges explained — $1.99',\n    bookKey: 'celeste-rivas-hernandez-d4vd-charges-guide',\n    placement: 'court_calendar_d4vd_status_entry',\n  },\n  'parker-smith-first-appearance': {\n    url: 'https://cassiancreed.beehiiv.com/products/both-sides-michelle-parker-guide-v3?utm_source=cassiancreed.com&utm_medium=court_calendar&utm_campaign=explainer_parker_bothsides_v3&utm_content=first_appearance_entry',\n    text: 'Both Sides of the Story: Michelle Parker — Can There Be a Murder Case With No Body?',\n    bookKey: 'both-sides-michelle-parker-guide-v3',\n    placement: 'court_calendar_parker_bothsides_first_appearance_entry',\n  },\n  'parker-smith-bond-hearing': {\n    url: 'https://cassiancreed.beehiiv.com/products/both-sides-michelle-parker-guide-v3?utm_source=cassiancreed.com&utm_medium=court_calendar&utm_campaign=explainer_parker_bothsides_v3&utm_content=bond_hearing_entry',\n    text: 'Both Sides of the Story: Michelle Parker — Can There Be a Murder Case With No Body?',\n    bookKey: 'both-sides-michelle-parker-guide-v3',\n    placement: 'court_calendar_parker_bothsides_bond_hearing_entry',\n  },\n  'pike-execution': {\n    url: 'https://cassiancreed.beehiiv.com/products/christa-pike-failed-execution-guide?utm_source=cassiancreed.com&utm_medium=court_calendar&utm_campaign=explainer_pike_v1&utm_content=next_step_entry',\n    text: 'Get the full Christa Pike case guide — timeline, every court step, six paths ahead — $1.99',\n    bookKey: 'christa-pike-failed-execution-guide',\n    placement: 'court_calendar_pike_next_step_entry',\n  },\n  'pike-stay-denial-sep23': {\n    url: 'https://cassiancreed.bee