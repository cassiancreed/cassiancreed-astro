name: CAL-04 inventory and verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inventory:
    if: github.head_ref == 'court/2026-10-18-cal-04-explainer-links'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify all repo post URLs and Beehiiv storefront discovery
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          async function get(url){try{const r=await fetch(url,{signal:AbortSignal.timeout(30000)});const html=await r.text();return {url,status:r.status,finalUrl:r.url,html}}catch(e){return {url,status:null,error:e.message,html:''}}}
          const files=await fs.readdir('src/content/posts');
          const pages=[];
          for(const name of files){if(!/\.(md|mdx)$/.test(name))continue;const raw=await fs.readFile('src/content/posts/'+name,'utf8');const front=raw.match(/^---\r?\n([\s\S]*?)\r?\n---/)?.[1]||'';const field=(key)=>front.match(new RegExp('^'+key+':\\s*(.*)$','m'))?.[1].trim().replace(/^["']|["']$/g,'');const slug=field('slug')||name.replace(/\.(md|mdx)$/,'');pages.push({slug,archived:field('archived')==='true',draft:field('draft')==='true',url:'https://cassiancreed.com/post/'+slug+'/'});}
          for(let i=0;i<pages.length;i+=8)await Promise.all(pages.slice(i,i+8).map(async p=>{const r=await get(p.url);console.log('CAL04_FREE '+JSON.stringify({...p,status:r.status,finalUrl:r.finalUrl,error:r.error}));}));
          for(const suffix of ['/store','/shop','/products','/sitemap.xml']){
           const r=await get('https://cassiancreed.beehiiv.com'+suffix);
           const products=[...new Set([...r.html.matchAll(/(?:https:\/\/cassiancreed\.beehiiv\.com)?\/products\/[a-z0-9-]+/g)].map(m=>m[0]))];
           console.log('CAL04_STOREFRONT '+JSON.stringify({url:r.url,status:r.status,title:r.html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1],products,navigation:r.html.match(/.{0,100}(?:store|shop).{0,180}/gi)?.slice(0,20)}));
          }
          
          JS
