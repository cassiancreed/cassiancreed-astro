name: GUIDE-01 independent suites and UI checks
on:
  push:
    branches: [guides/2026-10-18-parker-v3-previews]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Render for independent tests while PDF transfer is blocked
        run: npm ci && npx astro build
      - name: All suites
        run: |
          set -o pipefail
          node --test scripts/test-*.mjs | tee /tmp/guide-tests.tap
      - name: Check mobile, desktop, shared badges and live paid offers
        if: always()
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 > /tmp/guide-preview.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4321/ > /dev/null && break; sleep 1; done
          cat > .guide01-ui.mjs <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const browser=await chromium.launch();
          const results=[];
          mkdirSync('.guide01-receipts',{recursive:true});
          for(const width of [390,1280]){
           const page=await browser.newPage({viewport:{width,height:1000}});
           for(const route of ['/court-calendar/','/','/post/what-happens-at-d4vds-monday-hearing/','/post/michelle-parker-case-dale-smith-charged-no-body/']){
            await page.goto('http://127.0.0.1:4321'+route,{waitUntil:'networkidle'});
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2),false,route+' overflow '+width);
            const samples=await page.locator('a[data-guide-preview]').evaluateAll(ns=>ns.map(n=>({href:n.getAttribute('href'),target:n.target,rel:n.rel,badge:n.querySelector('.calendar-badge')?.textContent,bg:getComputedStyle(n.querySelector('.calendar-badge')).backgroundColor,color:getComputedStyle(n.querySelector('.calendar-badge')).color,previous:n.previousElementSibling?.getAttribute('data-link-type')})));
            assert.ok(samples.length>0,route+' preview');
            for(const sample of samples){assert.equal(sample.badge,'FREE');assert.equal(sample.target,'_blank');assert.equal(sample.rel,'noopener noreferrer');assert.equal(sample.bg,'rgb(134, 239, 172)');assert.equal(sample.color,'rgb(20, 17, 15)');assert.equal(sample.previous,'paid');}
            results.push({width,route,previews:samples.length,overflow:false,colors:'passed',adjacent:'passed'});
            await page.screenshot({path:'.guide01-receipts/'+(route==='/'?'home':route.split('/').filter(Boolean).at(-1))+'-'+width+'.png'});
           }
           await page.close();
          }
          await browser.close();
          for(const url of ['https://cassiancreed.beehiiv.com/products/both-sides-michelle-parker-guide-v3','https://cassiancreed.beehiiv.com/products/celeste-rivas-hernandez-d4vd-charges-guide']){
           const response=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0 (compatible; NEP-LinkCheck/1.0)'},signal:AbortSignal.timeout(30000)});
           const text=await response.text();assert.equal(response.status,200,url);assert.match(text,/\$1\.99/,url);
           results.push({url,status:response.status,price:'$1.99'});
          }
          writeFileSync('.guide01-receipts/audit.json',JSON.stringify({results,pdfAssets:'pending safe transfer'},null,2));
          console.log('GUIDE_UI '+JSON.stringify(results));
          NODE
          node .guide01-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide01-review-receipts
          path: .guide01-receipts/
      - name: Validation summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import{existsSync,readFileSync}from'node:fs';
          if(existsSync('/tmp/guide-tests.tap'))console.log(readFileSync('/tmp/guide-tests.tap','utf8').split('\n').filter(l=>/^# (tests|pass|fail|skipped) /.test(l)).join('\n'));
          console.log('The PDF-file existence test must remain failing until the supplied files are safely committed.');
          NODE
