name: SEO audit verification
on:
  push:
    branches: [seo/2026-10-18-search-and-ai-fixes]
permissions:
  contents: write
concurrency:
  group: seo-audit-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install preview dependency
        run: |
          npm ci
          npm install --save-dev --save-exact playwright@1.56.1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Declare Playwright for reproducible SEO preview checks"
            git push origin HEAD:seo/2026-10-18-search-and-ai-fixes
          fi
          echo "SEO_HEAD=$(git rev-parse HEAD)"
      - name: Verify protected content
        run: |
          git diff --name-only 9a3632ab4de8e0f7088c36096f382310f447c066 HEAD > /tmp/seo-changed-files.txt
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const base='9a3632ab4de8e0f7088c36096f382310f447c066';
          const files=readFileSync('/tmp/seo-changed-files.txt','utf8').trim().split('\n');
          const prohibited=files.filter(p=>p.endsWith('.tsv')||p.startsWith('src/content/posts/')||p.startsWith('public/covers/')||p.includes('_delivery')||p.endsWith('analytics.txt')||p==='netlify.toml');
          if(prohibited.length)throw Error('Protected files changed: '+prohibited.join(','));
          const previous=execFileSync('git',['show',base+':src/layouts/Base.astro'],{encoding:'utf8'}),current=readFileSync('src/layouts/Base.astro','utf8');
          const scripts=s=>[...s.matchAll(/<script(?:\s+is:inline)?>([\s\S]*?)<\/script>/g)].map(m=>m[0]);
          if(JSON.stringify(scripts(previous))!==JSON.stringify(scripts(current)))throw Error('Base script behavior changed');
          console.log('Protected data, post text, original art, production configuration and Base scripts unchanged.');
          NODE
      - name: Build and all Node tests
        run: |
          npm ci
          npm run build
          node --test scripts/test-*.mjs
          cp dist/sitemap.xml /tmp/seo-sitemap-after.xml
      - name: Baseline sitemap and Book parity
        run: |
          git worktree add --detach /tmp/seo-baseline 9a3632ab4de8e0f7088c36096f382310f447c066
          cd /tmp/seo-baseline
          npm ci
          npm run build
          cp dist/sitemap.xml /tmp/seo-sitemap-before.xml
          cp dist/books/jury-chess/index.html /tmp/seo-book-before.html
      - name: Report sitemap and image checks
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import sharp from 'sharp';
          const urls=p=>[...readFileSync(p,'utf8').matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]);
          const before=urls('/tmp/seo-sitemap-before.xml'),after=urls('/tmp/seo-sitemap-after.xml');
          const result={before:before.length,after:after.length,added:after.filter(x=>!before.includes(x)),removed:before.filter(x=>!after.includes(x))};
          console.log('SEO_SITEMAP='+JSON.stringify(result));writeFileSync('/tmp/seo-sitemap-results.json',JSON.stringify(result,null,2));
          const graphs=p=>[...readFileSync(p,'utf8').matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)].flatMap(m=>{const j=JSON.parse(m[1]);return j['@graph']??[j]});
          const oldBook=graphs('/tmp/seo-book-before.html').find(j=>j['@type']==='Book'),newBook=graphs('dist/books/jury-chess/index.html').find(j=>j['@type']==='Book');
          if(JSON.stringify(oldBook)!==JSON.stringify(newBook))throw Error('Book/Offer data changed');
          const {readdirSync,statSync}=await import('node:fs');const cards=[];
          for(const file of readdirSync('public/og').filter(f=>f.endsWith('.jpg'))){const p='public/og/'+file,m=await sharp(p).metadata();if(m.width!==1200||m.height!==630||statSync(p).size>=300000)throw Error('Invalid derivative '+file);cards.push({file,bytes:statSync(p).size,width:m.width,height:m.height});}
          console.log('SEO_CARDS='+JSON.stringify(cards));writeFileSync('/tmp/seo-card-results.json',JSON.stringify(cards,null,2));
          NODE
      - name: Install browser
        run: |
          npx playwright install --with-deps chromium
      - name: Astro preview compatibility checks
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/seo-preview.log 2>&1 &
          node --input-type=module -e "for(let i=0;i<60;i++){try{const r=await fetch('http://127.0.0.1:4321/');if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,500));}process.exit(1);"
          node scripts/check-seo-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit-verification
          path: |
            /tmp/seo-*.json
            /tmp/seo-*.png
            /tmp/seo-preview.log
