name: CAL-05 calendar UI audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cal05-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-*.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Check rendered calendar on desktop and mobile
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/cal05-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4321/court-calendar/ > /dev/null && break; sleep 1; done
          node scripts/check-calendar-link-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cal05-ui-receipts
          path: cal05-receipts/
