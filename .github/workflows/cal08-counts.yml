name: CAL-08 badge audit
on:
  push:
    branches: [media/2026-10-18-watch-calendar]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Rebuild and read actual badge markup
        run: |
          npm ci
          npm run build
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const counts={};
          for(const[route,file]of [['/court-calendar/','dist/court-calendar/index.html'],['/','dist/index.html']]){
           const html=readFileSync(file,'utf8'),totals={free:{total:0},paid:{total:0},book:{total:0}};
           for(const[tag]of html.matchAll(/<span\b[^>]*class="[^"]*\bcalendar-badge\b[^"]*"[^>]*>/g)){
            const type=tag.match(/data-link-type="(free|paid|book)"/)?.[1];
            assert.ok(type,'Badge lacks type');totals[type].total++;
           }
           assert.ok(totals.free.total>0&&totals.book.total>0,'Expected actual badge spans');
           counts[route]=totals;
           if(route==='/court-calendar/')for(const id of ['banks-federal-trial','eaton-burlington-trial']){
            const start=html.indexOf('id="'+id+'"');assert.ok(start>=0,id+' missing built entry');
            const snippet=html.slice(start,html.indexOf('</article>',start));
            assert.doesNotMatch(snippet,/<span\b[^>]*data-link-type="book"/,id+' rendered BOOK');
           }
          }
          const file='docs/audits/NEP-20261018-CAL-05.json',a=JSON.parse(readFileSync(file,'utf8'));
          assert.equal(a.bookEntryCount,9);
          a.builtPageBadges=counts;
          a.notes[1]='Built Court Calendar has '+counts['/court-calendar/'].book.total+' total BOOK badge spans; Home has '+counts['/'].book.total+'. These are static totals, not a new visibility measurement.';
          a.unchangedTsvs=false;
          a.unchangedCourtCalendarTsvs=true;
          a.cal08.mediaTsvChanged=true;
          a.cal08.badgeCounts={applicationHead:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),
           run:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,
           checkedAt:new Date().toISOString(),selector:'span.calendar-badge[data-link-type]',values:counts,
           excludedEntryRenderedBookCheck:'Banks and Eaton detailed entries have no BOOK badge'};
          writeFileSync(file,JSON.stringify(a,null,2)+'\n');
          console.log('CAL08_BADGES='+JSON.stringify(counts));
          
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/NEP-20261018-CAL-05.json
          git commit -m "Correct CAL-08 static badge counts using the shared component markup"
          git push origin HEAD:media/2026-10-18-watch-calendar
