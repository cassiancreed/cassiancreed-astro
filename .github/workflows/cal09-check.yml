nocent-people-confess-to-crimes-they-didn-t-commit/\",\n  \"/post/what-is-coercive-control-the-signs-examples-and-what-to-do/\",\n  \"/post/why-do-some-murders-go-unsolved-linkage-blindness/\",\n  \"/post/whose-consent-travels-across-borders/\"\n]);\n// Reviewed event matches, not case names or stale IDs. No book is inferred\n// from a hearing's notes, a grand jury, or an appellate reference to a verdict.\nexport const JURY_CHESS_ENTRY_IDS = new Set([\"faith-hedgepeth-trial\",\"murdaugh-retrial\",\"salazar-clinkunbroomer-trial\",\"bhatt-jury-selection\",\"moore-sherman-trial\",\"bohm-trial\",\"mary-collins-trial\",\"martin-risner-sentencing\"]);\n// killins-verdict-sentencing: living survivor.\nexport const JURY_CHESS_EXCLUDED_IDS = new Set([\"goncalves-wsu-trial\",\"aramburu-paris-trial\",\"kepner-federal-trial\",\"brianna-moore-trial\",\"clancy-trial\",\"virzi-trial\",\"michael-vaughan-trial\",\"crum-odom-verdict\",\"preston-lord-meisner-trial\",\"preston-lord-five-defendant-trial\",\"elmore-laura-miller-trial\",\"wagner-trial\",\"gardner-jury-selection\",\"gardner-trial\",\"bridegan-fernandez-trial\",\"farwell-jury-trial\",\"farwell-trial-oct19\",\"carter-brooks-trial\",\"ryan-cavett-trial\",\"killins-verdict-sentencing\",\"eaton-burlington-trial\",\"banks-federal-trial\",\"conway-mo3-trial\"]);\n// Jury Chess only on US criminal jury events. Never civil, foreign, child-victim, juvenile, or cases with a living survivor. Owner may override per case.\nexport function juryChessEligible(entry) {\n  if (JURY_CHESS_EXCLUDED_IDS.has(entry.id)) return false;\n  return JURY_CHESS_ENTRY_IDS.has(entry.id);\n}\nexport const JURY_CHESS_LINK = {\n  url: 'https://cassiancreed.com/books/',\n  text: 'Get Jury Chess',\n  bookKey: 'jury-chess',\n  placement: 'court_calendar_jury_chess',\n  type: 'book',\n  price: LIVE_PRODUCTS['jury-chess'].price,\n  badge: 'BOOK ' + LIVE_PRODUCTS['jury-chess'].price,\n  paid: false,\n};\nexport const CALENDAR_LINK_TYPES = ['free', 'paid', 'book'];\nexport function classifyCalendarLink(link) {\n  const path = pathKey(link.url);\n  const product = Object.values(LIVE_PRODUCTS).find((item) => pathKey(item.url) === path);\n  // A caller may never label a product checkout or Books destination FREE.\n  let destination;\n  try { destination = new URL(link.url, 'https://cassiancreed.com'); } catch { destination = { hostname:'', pathname:'' }; }\n  const productDestination = destination.hostname.endsWith('.beehiiv.com') && destination.pathname.startsWith('/products/');\n  const bookDestination = ((destination.hostname === 'cassiancreed.com' || destination.hostname === 'www.cassiancreed.com') && /^\\/books(?:\\/|$)/.test(destination.pathname))\n    || /\\/products\\/(jury-chess|two-stories-one-verdict)\\/?$/.test(destination.pathname) || link.bookKey === 'jury-chess';\n  const type = bookDestination ? 'book' : productDestination ? 'paid' : link.type || 'free';\n  const juryChessDestination = link.bookKey === 'jury-chess' || /^\\/books(?:\\/jury-chess)?\\/?$/.test(destination.pathname) || /\\/products\\/jury-chess\\/?$/.test(destination.pathname);\n  const price = product?.price || link.price || (juryChessDestination ? LIVE_PRODUCTS['jury-chess'].price : undefined);\n  if ((type === 'paid' || type === 'book') && !/^\\$\\d+\\.\\d{2}$/.test(price || '')) throw new Error('Missing verified calendar product price: ' + link.url);\n  return { ...link, type, price, paid: type === 'paid', badge: type === 'free' ? 'FREE' : type === 'book' ? 'BOOK ' + price : price + ' GUIDE' };\n}\nexport function calendarLinkTypesFor(entries) {\n  return CALENDAR_LINK_TYPES.filter((type) => entries.some((entry) => (entry.explainerLinks || calendarLinksFor(entry)).some((link) => link.type === type)));\n}\nconst byEntry = new Map(CALENDAR_EXPLAINER_CASES.flatMap((item) => item.entryIds.map((id) => [id, item])));\nconst pathKey = (url) => url.replace(/^https:\\/\\/cassiancreed\\.com/, '').split('?')[0].replace(/\\/$/, '');\nconst eligibleFree = (url) => !url.startsWith('/post/') || PUBLISHED_POSTS.has(url.split('?')[0]);\n\nexport function calendarLinksFor(entry) {\n  const matched = byEntry.get(entry.id);\n  const free = [];\n  const paid = [];\n  const seen = new Set();\n  const addFree = (url, text) => {\n    if (!url || !eligibleFree(url) || seen.has(pathKey(url))) return;\n    seen.add(pathKey(url));\n    free.push({ url, text, paid: false });\n  };\n  addFree(entry.link, entry.linkText || 'Read the case');\n  addFree(entry.link2, entry.linkText2 || 'Read the case');\n  for (const link of matched?.free || []) addFree(link.url, link.text);\n  for (const link of HISTORICAL_ROUNDUPS) {\n    if (link.keys.includes(matched?.key) || link.ids.includes(entry.id)) addFree(link.url, link.text);\n  }\n  const date = entry.dateISO || '';\n  if (WEEKLY_ROUNDUP_IDS.has(entry.id) && date >= '2026-10-19' && date <= '2026-10-23') {\n    addFree(WEEKLY_ROUNDUP.url, WEEKLY_ROUNDUP.text);\n  }\n  const addPaid = (guide) => {\n    if (!guide || seen.has(pathKey(guide.url))) return;\n    const product = Object.values(LIVE_PRODUCTS).find((item) => pathKey(item.url) === pathKey(guide.url));\n    if (!product) return;\n    seen.add(pathKey(guide.url));\n    paid.push({ ...guide, paid: true });\n  };\n  for (const guide of [EXISTING_CASE_GUIDES[entry.id]].flat().filter(Boolean)) addPaid(guide);\n  for (const key of matched?.paid || []) {\n    const product = LIVE_PRODUCTS[key];\n    if (!product) continue;\n    addPaid({\n      url: product.url + '?utm_source=cassiancreed.com&utm_medium=court_calendar&utm_campaign=' + (PRODUCT_CAMPAIGNS[key] || ('explainer_' + matched.key + '_v1')) + '&utm_content=' + entry.id.replace(/-/g, '_') + '_entry',\n      text: product.title + ' — ' + product.price,\n      bookKey: key,\n      placement: 'court_calendar_' + entry.id.replace(/-/g, '_') + '_entry',\n    });\n  }\n  const links = [...free, ...paid].map(classifyCalendarLink);\n  if (juryChessEligible(entry) && !links.some((link) => link.type === 'book')) links.push({ ...JURY_CHESS_LINK });\n  return links.filter((link) => link.type !== 'book' || juryChessEligible(entry))\n    .map((link) => link.bookKey === 'jury-chess' ? { ...link, ...JURY_CHESS_LINK, text: link.text } : link)\n    .sort((a, b) => CALENDAR_LINK_TYPES.indexOf(a.type) - CALENDAR_LINK_TYPES.indexOf(b.type));\n}\n","scripts/test-calendar-explainer-links.mjs":"import test from 'node:test';\nimport { JURY_CHESS_PRICE_TEXT } from '../src/data/book-prices.mjs';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nimport { calendarLinksFor, classifyCalendarLink, calendarLinkTypesFor, juryChessEligible, JURY_CHESS_ENTRY_IDS, JURY_CHESS_EXCLUDED_IDS } from '../src/data/calendar-explainer-links.mjs';\nimport { parseCourtCalendar } from '../src/data/court-calendar-parser.mjs';\nconst calendar = parseCourtCalendar(readFileSync(new URL('../src/data/court-calendar.tsv', import.meta.url), 'utf8'));\nconst entries = [...calendar.entries, ...calendar.appeals, ...calendar.unconfirmed, ...calendar.investigations, ...calendar.completed];\n\ntest('classifies destinations with text badges and real catalog prices', () => {\n  assert.equal(classifyCalendarLink({url:'/post/example/'}).badge, 'FREE');\n  assert.equal(classifyCalendarLink({url:'https://cassiancreed.beehiiv.com/products/case-chess-erin-patterson'}).badge, '$2.99 GUIDE');\n  assert.equal(classifyCalendarLink({url:'/books/'}).badge, 'BOOK ' + JURY_CHESS_PRICE_TEXT);\n  assert.equal(classifyCalendarLink({url:'https://cassiancreed.beehiiv.com/products/jury-chess'}).type, 'book');\n  assert.equal(classifyCalendarLink({url:'https://cassiancreed.beehiiv.com/products/future-guide',price:'$3.99'}).badge, '$3.99 GUIDE');\n});\ntest('all entry links use free, paid, book order and all paid badges carry a catalog price', () => {\n  for (const entry of entries) {\n    const links = calendarLinksFor(entry);\n    const ranks = links.map(l => ['free','paid','book'].indexOf(l.type));\n    assert.deepEqual(ranks, [...ranks].sort((a,b)=>a-b), entry.id);\n    for (const link of links) {\n      assert.ok(link.badge, entry.id);\n      if (link.type === 'paid') assert.match(link.badge, /^\\$\\d+\\.\\d{2} GUIDE$/);\n    }\n  }\n});\ntest('reviewed jury phases have exactly one approved Books link', () => {\n  for (const id of JURY_CHESS_ENTRY_IDS) {\n    const entry = entries.find(e=>e.id===id);\n    assert.ok(entry,id);\n    const links = calendarLinksFor(entry).filter(l=>l.bookKey==='jury-chess');\n    assert.equal(links.length,1,id);\n    assert.equal(links[0].url,'https://cassiancreed.com/books/',id);\n    assert.equal(links[0].badge,'BOOK ' + JURY_CHESS_PRICE_TEXT,id);\n  }\n});\ntest('unreviewed jury events never receive BOOK links', () => {\n  for (const proceeding of ['Jury trial','Jury selection','Jury verdict','Jury deliberations']) {\n    const entry = {id: 'new-unreviewed-jury-event', proceeding};\n    assert.equal(juryChessEligible(entry), false, proceeding);\n    assert.equal(calendarLinksFor(entry).some(link => link.type === 'book'), false, proceeding);\n    assert.equal(calendarLinksFor({...entry,link:'/books/',linkText:'Get Jury Chess'}).some(link => link.type === 'book'), false, 'Books URL cannot bypass allowlist');\n  }\n  for (const entry of entries) {\n    assert.equal(calendarLinksFor(entry).some(link => link.type === 'book'), JURY_CHESS_ENTRY_IDS.has(entry.id), entry.id);\n  }\n});\ntest('day markers aggregate all entries and retain free, paid, book order', () => {\n  assert.deepEqual(calendarLinkTypesFor([{explainerLinks:[{type:'book'},{type:'free'}]},{explainerLinks:[{type:'paid'}]}]),['free','paid','book']);\n  assert.deepEqual(calendarLinkTypesFor([]),[]);\n});\n\ntest('review exclusions never receive BOOK links, even when their event is a jury trial', () => {\n  assert.deepEqual([...JURY_CHESS_EXCLUDED_IDS], [\"goncalves-wsu-trial\",\"aramburu-paris-trial\",\"kepner-federal-trial\",\"brianna-moore-trial\",\"clancy-trial\",\"virzi-trial\",\"michael-vaughan-trial\",\"crum-odom-verdict\",\"preston-lord-meisner-trial\",\"preston-lord-five-defendant-trial\",\"elmore-laura-miller-trial\",\"wagner-trial\",\"gardner-jury-selection\",\"gardner-trial\",\"bridegan-fernandez-trial\",\"farwell-jury-trial\",\"farwell-trial-oct19\",\"carter-brooks-trial\",\"ryan-cavett-trial\",\"killins-verdict-sentencing\",\"eaton-burlington-trial\",\"banks-federal-trial\",\"conway-mo3-trial\"]);\n  for (const id of JURY_CHESS_EXCLUDED_IDS) {\n    const entry = entries.find(e => e.id === id);\n    assert.ok(entry, id);\n    assert.equal(JURY_CHESS_ENTRY_IDS.has(id), false, id);\n    assert.equal(juryChessEligible({...entry, proceeding: 'Jury trial'}), false, id);\n    assert.equal(calendarLinksFor(entry).some(link => link.type === 'book'), false, id);\n    assert.equal(calendarLinksFor({...entry,link:'/books/',linkText:'Get Jury Chess'}).some(link => link.type === 'book'), false, id+' explicit Books link');\n  }\n  for (const proceeding of ['Civil jury trial', 'Assize jury trial', 'Tribunal jury trial', 'Cour d’assises jury trial']) {\n    assert.equal(juryChessEligible({proceeding}), false, proceeding);\n  }\n});\n\ntest('paid and Books destinations cannot be overridden as FREE and always need real prices',()=>{\n  for(const url of ['https://cassiancreed.beehiiv.com/products/jury-chess','/books/','/books/jury-chess/','https://cassiancreed.com/books/#jury-chess']) {\n    assert.equal(classifyCalendarLink({url,type:'free'}).badge,'BOOK '+JURY_CHESS_PRICE_TEXT,url);\n  }\n  assert.equal(classifyCalendarLink({url:'https://cassiancreed.beehiiv.com/products/future-guide',type:'free',price:'$1.99'}).badge,'$1.99 GUIDE');\n  assert.throws(()=>classifyCalendarLink({url:'https://cassiancreed.beehiiv.com/products/unpriced-guide',type:'free'}),/Missing verified calendar product price/);\n  for(const entry of entries) for(const link of calendarLinksFor(entry)) {\n    if(link.type==='paid') assert.match(link.badge,/^\\$\\d+\\.\\d{2} GUIDE$/);\n    if(link.type==='book') assert.equal(link.badge,'BOOK '+JURY_CHESS_PRICE_TEXT);\n  }\n});\n\ntest('living-survivor cases stay outside the eight-entry BOOK allowlist',()=>{\n  assert.equal(JURY_CHESS_ENTRY_IDS.size,8);\n  for(const id of ['killins-verdict-sentencing','eaton-burlington-trial','banks-federal-trial','conway-mo3-trial']) {\n    const entry=entries.find(e=>e.id===id);assert.ok(entry,id);\n    assert.equal(JURY_CHESS_ENTRY_IDS.has(id),false,id);\n    assert.equal(JURY_CHESS_EXCLUDED_IDS.has(id),true,id);\n    assert.equal(juryChessEligible({...entry,proceeding:'Jury trial'}),false,id);\n    assert.equal(calendarLinksFor(entry).some(link=>link.type==='book'),false,id);\n    assert.equal(calendarLinksFor({...entry,link:'/books/',linkText:'Get Jury Chess'}).some(link=>link.type==='book'),false,id+' explicit Books link');\n  }\n});\n\ntest('Banks has no stale case-specific Jury Chess promotion if its exclusions change',()=>{\n  const allowed=[...JURY_CHESS_ENTRY_IDS],excluded=[...JURY_CHESS_EXCLUDED_IDS];\n  const entry=entries.find(e=>e.id==='banks-federal-trial');assert.ok(entry);\n  try {\n    JURY_CHESS_EXCLUDED_IDS.delete(entry.id);\n    JURY_CHESS_ENTRY_IDS.add(entry.id);\n    const books=calendarLinksFor(entry).filter(link=>link.type==='book');\n    assert.equal(books.length,1);\n    assert.equal(books[0].url,'https://cassiancreed.com/books/');\n    assert.equal(books[0].placement,'court_calendar_jury_chess');\n    assert.equal(books[0].text,'Get Jury Chess');\n  } finally {\n    JURY_CHESS_ENTRY_IDS.clear();for(const id of allowed)JURY_CHESS_ENTRY_IDS.add(id);\n    JURY_CHESS_EXCLUDED_IDS.clear();for(const id of excluded)JURY_CHESS_EXCLUDED_IDS.add(id);\n  }\n});\n"};
