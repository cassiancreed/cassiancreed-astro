name: CAL-03 link verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-links:
    if: github.head_ref == 'court/2026-10-17-cal-03-guide-links'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check new product links return HTTP 200
        run: |
          node --input-type=module <<'JS'
          const urls = ["https://cassiancreed.beehiiv.com/products/celeste-rivas-hernandez-d4vd-charges-guide?utm_source=cassiancreed.com&utm_medium=court_calendar&utm_campaign=explainer_d4vd_v2&utm_content=status_entry","https://cassiancreed.beehiiv.com/products/both-sides-michelle-parker-no-body-guide?utm_source=cassiancreed.com&utm_medium=court_calendar&utm_campaign=explainer_parker_bothsides_v2&utm_content=first_appearance_entry","https://cassiancreed.beehiiv.com/products/both-sides-michelle-parker-no-body-guide?utm_source=cassiancreed.com&utm_medium=court_calendar&utm_campaign=explainer_parker_bothsides_v2&utm_content=bond_hearing_entry"];
          let failed = false;
          for (const url of urls) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
              console.log(JSON.stringify({url, status: response.status, finalUrl: response.url}));
              await response.body?.cancel();
              if (response.status !== 200) failed = true;
            } catch (error) { console.log(JSON.stringify({url, error: error.message})); failed = true; }
          }
          if (failed) process.exit(1);
          JS
