name: MEDIA-01 draft validation
on:
  push:
    branches: [media/2026-10-18-watch-calendar]
permissions:
  contents: read
concurrency:
  group: media01-draft-validation
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Full build
        run: npm run build
      - name: All test suites
        run: node --test scripts/test-*.mjs
      - name: Check every media source and explainer URL
        id: links
        continue-on-error: true
        run: MEDIA_LINK_CHECK=1 node --test scripts/test-media-explainer-links.mjs
      - name: Install browser audit tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Local preview and responsive checks
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/media-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/true-crime-watch-calendar/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-media-calendar-ui.mjs
          node scripts/check-calendar-link-ui.mjs
      - name: Save screenshots and audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media01-draft-audit
          path: |
            media01-receipts/
            cal05-receipts/
      - name: Enforce link check
        if: steps.links.outcome == 'failure'
        run: exit 1
